<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Succession Planner</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#1a2433; --muted:#5c6b80; --faint:#8b98ab;
  --line:#dfe5ed; --line2:#eef1f6;
  --primary:#0b66c2; --primary-700:#0a539c; --primary-50:#eef5fc; --primary-100:#d8e8f8;
  --green:#1a7f4b; --green-bg:#e8f5ee; --green-line:#bfe3cf;
  --red:#c0392b; --red-bg:#fdecea; --red-line:#f3c1bb;
  --amber:#9a6700; --amber-bg:#fff6e0; --amber-line:#f0dfae;
  --blue-bg:#e8f1fb; --gray-bg:#eef1f5;
  --shadow:0 1px 2px rgba(26,36,51,.06),0 4px 14px rgba(26,36,51,.06);
  --shadow-lg:0 8px 30px rgba(26,36,51,.16);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{margin:0;font-weight:650}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid #c9d3e0;border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(11,102,194,.30);outline-offset:0;border-color:var(--primary)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-700)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#14643b}
.btn-quiet{background:var(--surface);color:var(--ink);border-color:#c9d3e0}
.btn-quiet:hover{background:var(--line2)}
.btn-danger{background:var(--surface);color:var(--red);border-color:var(--red-line)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:7px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:var(--muted);font-size:12px;line-height:1;border:1px solid transparent}
.icon-btn:hover{background:var(--line2);color:var(--ink);border-color:var(--line)}
.icon-btn.ok:hover{background:var(--green-bg);color:var(--green)}
.icon-btn.warn:hover{background:var(--amber-bg);color:var(--amber)}
.icon-btn.bad:hover{background:var(--red-bg);color:var(--red)}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(26,36,51,.05)}
.appbar-row{display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:.02em;flex:none}
.brand-name{font-size:15px;font-weight:700;line-height:1.2}
.brand-sub{font-size:11px;color:var(--muted)}
.file-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0;flex:1;justify-content:center}
.file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--line2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);display:none;flex:none}
.dirty .dirty-dot{display:inline-block}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);min-width:210px;padding:6px;display:none;z-index:80}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px}
.menu button:hover{background:var(--line2)}
.menu .sep{height:1px;background:var(--line2);margin:5px 4px}
.menu .danger{color:var(--red)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;align-items:flex-end;padding:0 14px;overflow-x:auto;scrollbar-width:thin}
.tab{position:relative;padding:10px 13px;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px 8px 0 0;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:var(--ink);background:var(--line2)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab .count{font-weight:500;color:var(--faint);margin-left:4px;font-size:11px}
.tab-add{color:var(--faint);font-weight:700;padding:10px 11px}
.tab-add:hover{color:var(--primary)}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 20px;background:#fafbfd;border-top:1px solid var(--line2)}
.filters .search-wrap{flex:0 1 320px;min-width:200px}
.filters select,.filters input{padding:7px 10px;font-size:12.5px}
/* --- filter chips (add / remove, multiselect) --- */
.fchip-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fchip{position:relative;display:inline-flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow:visible}
.fchip.active{border-color:var(--primary);background:var(--blue-bg)}
.fchip-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 4px 5px 11px;font-size:12px;color:var(--ink);border-radius:999px 0 0 999px;white-space:nowrap;cursor:pointer}
.fchip-btn .caret{font-size:9px;color:var(--muted)}
.fchip-btn:hover{background:var(--line2)}
.fchip-x{padding:5px 9px 5px 5px;font-size:10px;color:var(--muted);border-radius:0 999px 999px 0;cursor:pointer}
.fchip-x:hover{color:var(--red)}
.fchip-add{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;font-size:12px;color:var(--primary);border:1px dashed var(--line);border-radius:999px;background:transparent;cursor:pointer}
.fchip-add:hover{border-color:var(--primary);background:var(--blue-bg)}
.fchip-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(16,24,40,.14);padding:9px;min-width:190px;max-width:260px;max-height:270px;overflow:auto}
.fchip-pop label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--ink);margin:3px 0;text-transform:none;letter-spacing:0;cursor:pointer}
.fchip-pop label input{width:auto}
.fchip-pop-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.fchip-pop .linklike{color:var(--primary);font-size:11px;cursor:pointer;background:none;border:none;padding:0}
.fchip-pop .linklike:hover{text-decoration:underline}
.fchip-pop .pop-group{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:7px 0 3px}
.fchip-pop .pop-field{display:block;width:100%;text-align:left;padding:5px 7px;font-size:12px;border-radius:7px;cursor:pointer}
.fchip-pop .pop-field:hover{background:var(--line2)}
/* --- labeled toggle: reuses the input.switch pill the Rules list uses --- */
.switchline{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-bottom:0}
.switchline input.switch{width:34px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search-wrap input{padding-left:30px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:18px 20px;align-items:start}
.main-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.main-title h2{font-size:18px}
.hint{color:var(--muted);font-size:12px;margin-top:2px}
.view-actions{display:flex;gap:8px;flex:none}

/* ---------- banner / notices ---------- */
.banner{margin:12px 20px -4px;background:var(--amber-bg);border:1px solid var(--amber-line);color:#6b4a00;border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:12px;font-size:12.5px}
.banner .btn{flex:none}
.notice{border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.notice b{flex:none}
.notice.warn{background:var(--amber-bg);border:1px solid var(--amber-line);color:#6b4a00}
.notice.err{background:var(--red-bg);border:1px solid var(--red-line);color:#7c231a}
.notice.ok{background:var(--green-bg);border:1px solid var(--green-line);color:#125c38}

/* ---------- side ---------- */
.side{position:sticky;top:170px;max-height:calc(100vh - 190px);overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:8px;scrollbar-width:thin}
.side-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.side-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;text-align:left}
.stat b{display:block;font-size:19px;font-weight:700;line-height:1.15}
.stat span{font-size:10.5px;color:var(--muted);font-weight:600}
.piecebox{display:flex;flex-direction:column;gap:7px;max-height:380px;overflow:auto;scrollbar-width:thin}
.piece{border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:grab;background:var(--surface);display:flex;gap:9px;align-items:flex-start}
.piece:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.piece.selected{border-color:var(--primary);background:var(--primary-50)}
.piece-name{font-size:12.5px;font-weight:650}
.piece-meta{font-size:11px;color:var(--muted);line-height:1.4}
.piece-actions{margin-top:5px;display:flex;gap:6px}
.selected-banner{background:var(--primary-50);border:1px solid var(--primary-100);color:var(--primary-700);border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;font-size:12px}
.panel:last-child{margin-bottom:0}

/* ---------- avatars & badges ---------- */
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;flex:none;user-select:none}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:650;white-space:nowrap;border:1px solid transparent}
.badge.green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.badge.blue{background:var(--blue-bg);color:var(--primary-700);border-color:var(--primary-100)}
.badge.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.badge.red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.badge.gray{background:var(--gray-bg);color:var(--muted);border-color:var(--line)}
.chip{display:inline-block;background:var(--line2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}

/* ---------- board ---------- */
.level{margin-bottom:18px}
.level-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;padding:0 2px}
.lane{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px;border:1px dashed #c4cede;border-radius:12px;padding:10px;min-height:60px;background:rgba(255,255,255,.4)}
.role{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px}
.role:hover{box-shadow:var(--shadow)}
.role.risk-high,.role.risk-critical{border-left-color:var(--red)}
.role.risk-medium{border-left-color:var(--amber)}
.role.risk-low{border-left-color:var(--green)}
.role.dragover{outline:2px solid var(--primary);outline-offset:1px}
.role-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.role-name{font-size:13.5px;font-weight:700;line-height:1.3}
.role-meta{font-size:11px;color:var(--muted);margin-top:2px}
.incumbent{display:flex;align-items:center;gap:8px;font-size:12px;border:1px solid var(--line2);background:#fafbfd;border-radius:8px;padding:6px 8px}
.incumbent .who b{display:block;font-size:12px;font-weight:650;line-height:1.25}
.incumbent .who span{font-size:10.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.succ-list{display:flex;flex-direction:column;gap:5px}
.succ{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;background:#fafbfd;padding:5px 7px;font-size:11.5px;cursor:grab}
.succ:hover{border-color:var(--primary)}
.succ.approved{border-color:var(--green-line);background:var(--green-bg)}
.succ.autoqueued{border-color:var(--amber-line);background:var(--amber-bg)}
.succ.dragover{outline:2px solid var(--primary)}
.succ .rank{flex:none;width:17px;height:17px;border-radius:50%;background:var(--line2);color:var(--muted);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.succ.approved .rank{background:var(--green);color:#fff}
.succ.autoqueued .rank{background:var(--amber);color:#fff}
.succ-main{flex:1;min-width:0;line-height:1.3}
.succ-main .nm{font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.succ-main .sub{color:var(--muted);font-size:10.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.succ-btns{display:flex;gap:2px;flex:none}
.drop-hint{border:1px dashed var(--line);border-radius:8px;color:var(--faint);font-size:11px;padding:8px;text-align:center}
.role-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

/* ---------- org tree (pan & zoom canvas) ---------- */
.tree{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);height:calc(100vh - 275px);min-height:420px;overflow:hidden;cursor:grab;text-align:center;user-select:none}
.tree.dragging{cursor:grabbing}
.tree-canvas{position:absolute;left:0;top:0;transform-origin:0 0;padding:24px;width:max-content}
.tree-controls{position:absolute;right:12px;top:12px;z-index:3;display:flex;flex-direction:column;gap:6px}
.tree-controls .btn{padding:6px 10px;box-shadow:var(--shadow)}
.tree-hint{position:absolute;left:12px;bottom:10px;z-index:3;font-size:11px;color:var(--faint);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
.tree-item{display:flex;flex-direction:column;align-items:center}
.node{min-width:170px;max-width:230px;border:1px solid var(--line);border-top:3px solid var(--primary);border-radius:9px;background:var(--surface);margin:7px;padding:9px 11px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.node:hover{border-color:var(--primary)}
.node b{font-size:12.5px;display:block;line-height:1.3}
.node .nsub{font-size:11px;color:var(--muted);margin-top:2px}
.node .nvac{color:var(--red);font-weight:650}
.children{display:flex;justify-content:center;gap:8px;position:relative;padding-top:20px}
.children:before{content:"";position:absolute;top:8px;left:12%;right:12%;border-top:1px solid var(--line)}

/* ---------- tables ---------- */
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th{position:sticky;top:0;background:#fafbfd;text-align:left;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.table td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.table tbody tr:hover{background:#f6f9fd}
.table tbody tr:last-child td{border-bottom:0}
.row-click{cursor:pointer}
.tfoot-note{padding:8px 12px;color:var(--faint);font-size:11.5px}

/* ---------- insights ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:700;line-height:1.2}
.kpi small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.kpi .sub{font-size:10.5px;color:var(--faint);margin-top:3px}
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.insight-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.insight-card h3{font-size:13px;margin-bottom:10px}
.barrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 52px;gap:8px;align-items:center;margin-bottom:7px;font-size:12px}
.barrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.barrow .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.track{display:block;height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.fill{display:block;height:100%;border-radius:4px;background:var(--primary);min-width:2px}
.fill.dim{background:var(--primary-100)}
.full-card{grid-column:1/-1}

/* ---------- rules ---------- */
.rule-summary{color:var(--muted);font-size:11.5px;max-width:420px}
.switch{appearance:none;width:34px;height:19px;border-radius:999px;background:#c9d3e0;position:relative;cursor:pointer;flex:none;transition:background .15s;border:0;padding:0}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch:checked{background:var(--green)}
.switch:checked:after{left:17px}
.rule-section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin:12px 0}
.rule-section h3{font-size:13px;margin-bottom:8px}
.condition-row,.custom-map-row{display:grid;grid-template-columns:1fr 1fr 1.3fr auto;gap:8px;align-items:end;background:#fafbfd;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px}
.tab-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;background:#fafbfd;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px}
.value-picker{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:160px;overflow:auto}
.value-picker label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink);font-weight:500;margin:3px 0;text-transform:none;letter-spacing:0}
.value-picker input{width:auto}
.value-picker .select-all{border-bottom:1px solid var(--line2);padding-bottom:6px;margin-bottom:6px;font-weight:700}

/* ---------- drawer ---------- */
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(20,28,40,.5);z-index:100}
.drawer-backdrop.open{display:block}
.drawer{position:fixed;right:0;top:0;width:min(900px,100vw);height:100vh;background:#f8fafc;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column}
.drawer-backdrop.open .drawer{transform:translateX(0)}
.drawer-head{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 22px;flex:none}
.drawer-head h2{font-size:17px}
.drawer-head .sub{color:var(--muted);font-size:12px;margin-top:3px}
.drawer-body{padding:18px 22px;overflow:auto;flex:1}
.drawer-actions{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.full{grid-column:1/-1}
.form-note{background:var(--primary-50);border:1px solid var(--primary-100);color:var(--primary-700);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:14px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.choice-card h3{font-size:14.5px;margin-bottom:6px}
.drawer-section-title{font-size:13px;font-weight:700;margin:18px 0 8px}

/* ---------- empty state ---------- */
.empty{background:var(--surface);border:1px dashed #c4cede;border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--muted);font-size:12.5px}
.empty .big{font-size:15px;font-weight:650;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:12px}

/* ---------- toasts & modal ---------- */
#toasts{position:fixed;bottom:14px;right:14px;z-index:300;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 28px))}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:9px;box-shadow:var(--shadow-lg);padding:10px 12px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start;animation:toast-in .16s ease}
.toast.ok{border-left-color:var(--green)}
.toast.warn{border-left-color:var(--amber)}
.toast.err{border-left-color:var(--red)}
.toast .t-close{margin-left:auto;flex:none}
@keyframes toast-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,28,40,.42);z-index:250;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);width:min(420px,92vw);padding:18px}
.modal h3{font-size:15px;margin-bottom:6px}

/* ---------- chess view ---------- */
.chess-overlay{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.chess-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chess-head h2{font-size:17px;display:flex;align-items:center;gap:8px}
.chess-head .glyph{font-size:22px;line-height:1}
.chess-head .hint{flex:1;min-width:200px}
.chess-body{padding:20px 22px 40px;max-width:1250px;margin:0 auto;width:100%}
.chess-callouts{margin-bottom:14px}
.throne-row{display:flex;justify-content:center;align-items:stretch;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.throne{width:min(320px,90vw);border:2px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#fff,#f2f5f9);padding:16px;text-align:center;position:relative}
.throne.vacant{border-style:dashed;border-color:var(--red-line)}
.throne.staged{border-color:var(--green);background:linear-gradient(180deg,#fff,var(--green-bg))}
.throne.dragover{outline:3px solid var(--primary);outline-offset:2px}
.throne .king{font-size:52px;line-height:1;display:block}
.throne .t-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.throne .t-name{font-size:15px;font-weight:700;margin-top:4px}
.throne .t-sub{font-size:11.5px;color:var(--muted)}
.steps-down{align-self:center;max-width:230px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted)}
.chess-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.square{padding:14px 12px;min-height:150px;border:1px solid var(--line2);cursor:grab;position:relative;display:flex;flex-direction:column;gap:2px}
.square.alt{background:#eef1f6}
.square:hover{background:var(--primary-50)}
.square.dragover{outline:3px solid var(--primary);outline-offset:-3px;z-index:1}
.square .pglyph{font-size:38px;line-height:1.1}
.square .prank{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.square .pname{font-size:13px;font-weight:700;line-height:1.25;margin-top:2px}
.square .pinfo{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}
.square .pinfo b{color:var(--ink);font-weight:600}
.square .plink{position:absolute;top:8px;right:8px}
.chess-empty{padding:40px;text-align:center;color:var(--muted)}
.chess-grid.dragover{outline:2px solid var(--primary);outline-offset:2px}
.chess-cols{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.chess-bank{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:76px}
.bank-list{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto;margin-top:8px;scrollbar-width:thin}
.bank-piece{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fafbfd;cursor:grab;font-size:12px}
.bank-piece:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.bp-glyph{font-size:20px;line-height:1;flex:none}
.bp-main{min-width:0;display:flex;flex-direction:column}
.bp-main b{font-size:12px;line-height:1.3}
.bp-main span{color:var(--muted);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.square .new-flag{position:absolute;top:8px;left:8px}
.chess-foot{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:10px 22px;display:flex;gap:10px;align-items:center;justify-content:center;margin-top:auto}
.chess-foot label{margin:0;white-space:nowrap}
.chess-foot select{width:min(420px,60vw)}
@media(max-width:1000px){.chess-cols{grid-template-columns:1fr}.chess-bank{position:static}}
.chess-fields-wrap{position:relative}
.chess-fields-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);width:280px;padding:12px;z-index:20}
.chess-fields-menu label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);font-weight:500;margin:5px 0;text-transform:none;letter-spacing:0}
.chess-fields-menu input[type=checkbox]{width:auto}
.chess-fields-menu .cf-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.pending-chip{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:650}
.node.inferred{border-top-style:dashed}
.node .ninf{font-size:9.5px;color:var(--faint);font-style:italic}
.extra-fields{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:14px}
.extra-fields .grid{margin-top:8px}
/* ---------- appearance: color themes ---------- */
html[data-theme="forest"]{--primary:#147a41;--primary-700:#0f5e33;--primary-50:#e9f6ef;--primary-100:#cdeadb}
html[data-theme="plum"]{--primary:#6d28d9;--primary-700:#5b21b6;--primary-50:#f3eefc;--primary-100:#e4d9f7}
html[data-theme="sunset"]{--primary:#c2570b;--primary-700:#9a4508;--primary-50:#fdf1e7;--primary-100:#f9ddc4}
html[data-theme="ocean"]{--primary:#0e7490;--primary-700:#0b5c73;--primary-50:#e8f6fa;--primary-100:#cdeaf2}
/* ---------- appearance: chess board styles ---------- */
#chessOverlay.board-wood .square{background:#f7ead2}
#chessOverlay.board-wood .square.alt{background:#dfc094}
#chessOverlay.board-wood .square:hover{background:#f2dcae}
#chessOverlay.board-wood .chess-grid{border-color:#c9a061;background:#fbf3e2}
#chessOverlay.board-wood .throne{background:linear-gradient(180deg,#fdf6e7,#eed9b4);border-color:#c9a061}
#chessOverlay.board-felt .square{background:#eaf6ef}
#chessOverlay.board-felt .square.alt{background:#c9e7d4}
#chessOverlay.board-felt .square:hover{background:#dcf0e4}
#chessOverlay.board-felt .chess-grid{border-color:#9ccdb0;background:#f2faf5}
#chessOverlay.board-felt .throne{background:linear-gradient(180deg,#f4fbf6,#d9eee1);border-color:#9ccdb0}
#chessOverlay.board-marble .square{background:#f4f6fa}
#chessOverlay.board-marble .square.alt{background:#d8dde6}
#chessOverlay.board-marble .square:hover{background:#e8ecf3}
#chessOverlay.board-marble .chess-grid{border-color:#b9c2d0;background:#eef1f6}
#chessOverlay.board-marble .throne{background:linear-gradient(180deg,#fafbfd,#e2e7ee);border-color:#b9c2d0}
/* ---------- appearance panel ---------- */
.appearance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.app-swatch{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:14px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.app-swatch:hover{border-color:var(--primary)}
.app-swatch.selected{border-color:var(--primary);background:var(--primary-50)}
.swatch-dot{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.swatch-pieces{font-size:19px;letter-spacing:2px;line-height:1.3}
.swatch-board{display:grid;grid-template-columns:15px 15px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.swatch-board i{width:15px;height:15px;display:block}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c4cede;border-radius:5px;border:2px solid transparent;background-clip:content-box}

@media(max-width:1250px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}}
@media(max-width:900px){
  .appbar-row{flex-wrap:wrap}.file-status{order:3;flex-basis:100%;justify-content:flex-start}
  .filters{grid-template-columns:1fr 1fr}.grid,.insight-grid,.choice-grid{grid-template-columns:1fr}
  .condition-row,.custom-map-row,.tab-row{grid-template-columns:1fr}
}
@media print{.appbar,.side,.drawer-backdrop,#toasts{display:none!important}.layout{grid-template-columns:1fr;padding:0}}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-row">
    <div class="brand">
      <div class="brand-mark">SP</div>
      <div><div class="brand-name">Succession Planner</div><div class="brand-sub">Talent Acquisition · HR</div></div>
    </div>
    <div class="file-status" id="fileStatus">
      <span class="file-chip" id="dbStatus">No CSV loaded</span>
      <span class="dirty-dot" title="Unsaved changes"></span>
      <span id="saveStatus">Ready</span>
    </div>
    <div class="toolbar">
      <button class="btn btn-quiet" data-action="openCSV">Open CSV</button>
      <button class="btn btn-primary" data-action="saveCSV" title="Save to the opened CSV file (Ctrl+S)">Save</button>
      <button class="btn btn-quiet" data-action="exportCSV" title="Download a copy of the CSV database">Export</button>
      <button class="btn btn-green" data-action="addChooser">+ Add</button>
      <button class="btn btn-quiet" data-action="undo" title="Undo last change (Ctrl+Z)">Undo</button>
      <button class="btn btn-quiet" data-action="appearance" title="Appearance — themes and chess piece styles">&#127912;</button>
      <div class="menu-wrap">
        <button class="btn btn-quiet" data-action="toggleMenu" title="More actions">&#8943;</button>
        <div class="menu" id="moreMenu">
          <button data-action="manageTabs">Manage tabs&hellip;</button>
          <button data-action="exportXlsx">Export Excel workbook (.xlsx)</button>
          <button data-action="downloadTemplate">Download starter template</button>
          <button data-action="downloadSheetTemplates">Download simple sheet templates</button>
          <div class="sep"></div>
          <button data-action="dataTools">Data Tools&hellip;</button>
          <div class="sep"></div>
          <button data-action="resetOrg">Reset org changes to import</button>
          <button class="danger" data-action="clearAll">Clear all data&hellip;</button>
        </div>
      </div>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <section class="filters" id="filters">
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" data-input="render" placeholder="Search roles, people, IDs, departments&hellip;">
    </div>
    <div id="filterChips" class="fchip-row"></div>
  </section>
</header>
<div id="banner"></div>
<main class="layout">
  <section class="main">
    <div class="main-title">
      <div><h2 id="viewTitle">Board</h2><div class="hint" id="viewHint"></div></div>
      <div class="view-actions" id="viewActions"></div>
    </div>
    <div id="notices"></div>
    <div id="mainView"></div>
  </section>
  <aside class="side">
    <div class="stats" id="stats"></div>
    <div class="side-block">
      <div class="side-title">Candidate Box</div>
      <div class="hint" style="margin-bottom:8px">Drag a candidate onto a role, or click to open the profile.</div>
      <div style="margin-bottom:7px">
        <input id="pieceSearch" data-input="pieceBox" placeholder="Search candidates&hellip;" style="width:100%">
      </div>
      <div id="pieceFilters" class="fchip-row" style="margin-bottom:9px"></div>
      <div id="pieceBox" class="piecebox"></div>
    </div>
    <div class="side-block">
      <div class="side-title">Approved Moves</div>
      <div id="approvedPanel"></div>
    </div>
    <div class="side-block">
      <div class="side-title">Recent Messages</div>
      <div id="messagesPanel"></div>
    </div>
  </aside>
</main>
<div class="drawer-backdrop" id="drawer">
  <aside class="drawer" role="dialog" aria-modal="true">
    <div class="drawer-head">
      <h2 id="drawerTitle">Drawer</h2>
      <div class="sub" id="drawerSub"></div>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-actions">
      <div id="drawerLeft" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-quiet" id="backBtn" style="display:none" data-action="goBack">Back</button>
        <button class="btn btn-quiet" data-action="closeDrawer">Close</button>
        <button class="btn btn-primary" id="drawerSave">Save</button>
      </div>
    </div>
  </aside>
</div>
<div id="chessOverlay" class="chess-overlay hidden"></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   Succession Planner — single-file app, CSV file is the database.
   Data model & CSV format are identical to the v26 planner:
   record types BOARD, PERSON, ROLE, SUCCESSOR, RULE, HISTORY, SETTING
   ===================================================================== */
const CSV_HEADERS=['recordType','boardId','boardName','roleId','roleTitle','level','department','managerRoleId','incumbentPersonId','incumbentName','risk','criticality','owner','status','sortOrder','personId','personName','personTitle','personDepartment','personEmail','location','jobLevel','performance','potential','retentionRisk','mobility','criticalExperience','skills','readiness','source','candidateType','confidence','ranking','notes','successorRoleId','approved','autoMoveQueued','ruleId','ruleName','ruleType','ruleScope','ruleField','ruleOperator','ruleValue','rulePersonId','ruleTargetRoleId','ruleAltPersonId','ruleSeverity','ruleMessage','ruleEnabled','historyId','historyDate','historyAction','historyDetails','settingKey','settingValue'];
const SYSTEM_BOARDS=['MASTER','ALL','PEOPLE','INSIGHTS','RULES','HISTORY'];
const SYSTEM_TABS=[{id:'MASTER',name:'Org Tree'},{id:'ALL',name:'All Roles'},{id:'PEOPLE',name:'Candidates'},{id:'INSIGHTS',name:'Insights'},{id:'RULES',name:'Rules'},{id:'HISTORY',name:'History'}];
const DEFAULT_LEVELS=['CEO','C-Suite','EVP','SVP','VP','Sr Director','Director','Senior Manager','Manager','Individual Contributor'];
const CANDIDATE_FIELDS=['readiness','source','candidateType','confidence','location','jobLevel','performance','potential','retentionRisk','mobility','criticalExperience','skills','department'];
const TEXT_OPERATORS=['contains','not contains','greater than','less than'];
const FIELD_TYPES=['text','number','boolean'];
const BUILTIN_TYPABLE=[...CANDIDATE_FIELDS,'level','risk','criticality','status','owner'];
// numeric fields accept plain numbers or a dash range like 2-5 (the one exception)
const NUM_RANGE_RE=/^\s*-?\d+(\.\d+)?(\s*-\s*-?\d+(\.\d+)?)?\s*$/;
/* categorical palette for pie/donut slices — validated with the dataviz palette
   checker (lightness band, chroma, CVD ΔE 9.1, normal-vision ΔE 19.6, all PASS;
   the contrast warning is covered by the always-on labeled legend) */
const CHART_COLORS=['#2a78d6','#008300','#e87ba4','#eda100','#1baf7a','#eb6834'];
const CHESS_DEFAULT_FIELDS=['title','readiness','candidateType'];
const PIECE_SETS={
  classic:{name:'Classic chess',king:'♚',ranks:[['♛','Queen'],['♜','Rook'],['♝','Bishop'],['♞','Knight'],['♟','Pawn']]},
  royal:{name:'Royal court',king:'👑',ranks:[['🏆','Queen'],['🎖️','Rook'],['🛡️','Bishop'],['⚔️','Knight'],['🎗️','Pawn']]},
  animals:{name:'Animal kingdom',king:'🦁',ranks:[['🦅','Queen'],['🐻','Rook'],['🦊','Bishop'],['🐺','Knight'],['🐾','Pawn']]},
  woodland:{name:'Woodland',king:'🌳',ranks:[['🦉','Queen'],['🦌','Rook'],['🦔','Bishop'],['🐿️','Knight'],['🍄','Pawn']]},
  holiday:{name:'Holiday',king:'🎅',ranks:[['🌟','Queen'],['🎄','Rook'],['⛄','Bishop'],['🦌','Knight'],['🎁','Pawn']]},
  galaxy:{name:'Galaxy',king:'🪐',ranks:[['🚀','Queen'],['🛸','Rook'],['⭐','Bishop'],['🌙','Knight'],['👾','Pawn']]},
  robots:{name:'Robot lab',king:'🤖',ranks:[['🦾','Queen'],['⚙️','Rook'],['🔋','Bishop'],['🛠️','Knight'],['🔩','Pawn']]},
  fantasy:{name:'Fantasy quest',king:'🧙',ranks:[['🐉','Queen'],['🦄','Rook'],['⚔️','Bishop'],['🛡️','Knight'],['🏹','Pawn']]},
  dinos:{name:'Dinosaurs',king:'🦖',ranks:[['🦕','Queen'],['🐊','Rook'],['🦎','Bishop'],['🐢','Knight'],['🥚','Pawn']]},
  ocean:{name:'Deep sea',king:'🔱',ranks:[['🐋','Queen'],['🦈','Rook'],['🐬','Bishop'],['🐙','Knight'],['🐟','Pawn']]},
  champions:{name:'Champions',king:'🏆',ranks:[['🥇','Queen'],['🥈','Rook'],['🥉','Bishop'],['🏅','Knight'],['⚽','Pawn']]},
};
const APPEARANCE_KEY='succession_planner_appearance_v1';
let appearance={theme:'classic',pieces:'classic',board:'classic'};
try{const a=JSON.parse(localStorage.getItem(APPEARANCE_KEY)||'{}');if(a&&typeof a==='object')appearance={...appearance,...a}}catch(e){}
function applyAppearance(){
  document.documentElement.dataset.theme=appearance.theme||'classic';
  try{localStorage.setItem(APPEARANCE_KEY,JSON.stringify(appearance))}catch(e){}
}
applyAppearance();
function pieceSet(){return PIECE_SETS[appearance.pieces]||PIECE_SETS.classic}
function pieceKing(){return pieceSet().king}
function piecePawn(){return pieceSet().ranks[4][0]}
const BACKUP_KEY='succession_planner_backup_v1';
const LIST_CAP=400;   // max table rows rendered at once
const PIECE_CAP=200;  // max candidate cards rendered at once
const MAX_XLSX_MB=20, MAX_CSV_MB=50, MAX_SHEET_ROWS=25000, MAX_WIDGETS=8;

/* ---------- feature locks for shared copies of the program ----------
   Empty = the full program. When a restricted copy is generated through
   Share / Export, the next line is rewritten with the locked features —
   keep the marker comment exactly as is. */
const PROGRAM_LOCKS={}; /*PROGRAM_LOCKS*/
const LOCK_INFO={
  rules:'Rules (viewing & editing)',
  addRoles:'Adding roles',
  addPeople:'Adding candidates',
  del:'Deleting people & roles',
  moves:'Approvals & seat moves',
  tools:'Import, merge & Data Tools',
};
function locked(k){return !!PROGRAM_LOCKS[k]}
function anyLocks(){return Object.keys(LOCK_INFO).some(k=>PROGRAM_LOCKS[k])}
function lockNotice(k){notice('WARN',(LOCK_INFO[k]||'This feature')+' is turned off in this shared copy of the planner.')}

/* personal view flag: extra Roles/Tabs columns on the Candidates tab */
const PEOPLE_WHERE_KEY='succession_planner_people_where_v1';
let peopleShowWhere=false;try{peopleShowWhere=localStorage.getItem(PEOPLE_WHERE_KEY)==='1'}catch(e){}

let boards=systemBoards(),roles=[],people=[],successors=[],rules=[],history=[],messages=[];
let fileHandle=null,selectedPersonId='',backRoleId='',undoStack=[],importBaseline=null,currentDrawerPersonId='',customFieldValues={};
let activeTab='MASTER',dirty=false,backupTimer=null,automationDepth=0;
let chess=null,chessSessionFields=null,chessDefaultFields=null,lastInferred=null;
let bannerState={backup:null,fileName:''},reconnectHandle=null,importReview=null;
let fieldTypes={},treeView=null,treeClickSuppressed=false,insightWidgets=[];

function systemBoards(){return SYSTEM_TABS.map(t=>({id:t.id,name:t.name}))}
function uid(p){return p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function attr(v){return esc(v).replaceAll('`','&#096;')}
function norm(v){return String(v??'').trim().toLowerCase()}
function v(id){const el=document.getElementById(id);return el?el.value:''}
function el(id){return document.getElementById(id)}
function person(id){return people.find(p=>p.id===id)}
function role(id){return roles.find(r=>r.id===id)}
function personName(id,f='VACANT'){const p=person(id);return p?p.name:(f||'VACANT')}
function deepClone(x){return JSON.parse(JSON.stringify(x))}
function plur(n,w){return n+' '+w+(n===1?'':'s')}
function pct(a,b){return b?Math.round(a/b*100):0}
function fmtDate(iso){const d=new Date(iso);return isNaN(d)?String(iso||''):d.toLocaleString([],{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}

/* ---------- avatars & badges ---------- */
function hashCode(s){let h=0;for(let i=0;i<String(s).length;i++){h=(h*31+String(s).charCodeAt(i))|0}return Math.abs(h)}
function initials(name){const parts=String(name||'?').trim().split(/\s+/);return ((parts[0]||'')[0]||'?').toUpperCase()+((parts.length>1?parts[parts.length-1][0]:'')||'').toUpperCase()}
function avatarHtml(name,size=26){const hue=hashCode(name||'')%360;return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px;background:hsl(${hue},42%,88%);color:hsl(${hue},45%,30%)">${esc(initials(name))}</span>`}
function readinessBadge(val){const s=readinessScore(val);const cls=s===1?'green':s===2?'blue':s===3?'amber':'gray';return `<span class="badge ${cls}">${esc(val||'—')}</span>`}
function riskBadge(val){const n=norm(val);const cls=(n==='high'||n==='critical')?'red':n==='medium'?'amber':n==='low'?'green':'gray';return `<span class="badge ${cls}">${esc(val||'—')} risk</span>`}
function statusToast(type){return type==='ERR'?'err':type==='OK'?'ok':'warn'}

/* ---------- status, log, notices, toasts ---------- */
function setStatus(t){el('saveStatus').textContent=t}
function log(action,details){if(history[0]&&history[0].action===action&&history[0].details===details)return;history.unshift({id:uid('H'),date:new Date().toISOString(),action,details})}
function notice(type,msg){
  if(!(messages[0]&&messages[0].type===type&&messages[0].message===msg)){
    messages.unshift({id:uid(type),type,message:msg});
    spawnToast(type,msg);
  }
  renderMessages();
}
function spawnToast(type,msg){
  const box=el('toasts');if(!box)return;
  while(box.children.length>=4)box.firstChild.remove();
  const t=document.createElement('div');
  t.className='toast '+statusToast(type);
  t.innerHTML=`<div>${esc(msg)}</div><button class="icon-btn t-close" title="Dismiss">&#10005;</button>`;
  t.querySelector('.t-close').onclick=()=>t.remove();
  box.appendChild(t);
  setTimeout(()=>{if(t.parentNode)t.remove()},4600);
}

/* ---------- dirty tracking, local backup & remembered file ---------- */
function writeBackup(clean){try{localStorage.setItem(BACKUP_KEY,JSON.stringify({ts:Date.now(),csv:toCSV(),clean:!!clean,fileName:fileHandle?.name||''}))}catch(e){}}
function markDirty(){
  dirty=true;
  el('fileStatus').classList.add('dirty');
  setStatus('Unsaved changes');
  clearTimeout(backupTimer);
  backupTimer=setTimeout(()=>writeBackup(false),900);
}
function markClean(msg){
  dirty=false;
  el('fileStatus').classList.remove('dirty');
  if(msg)setStatus(msg);
  clearTimeout(backupTimer);
  backupTimer=setTimeout(()=>writeBackup(true),900);
}
/* tiny IndexedDB key-value store — used to remember the opened file handle across sessions */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('succession_planner',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function idbGet(k){try{const db=await idbOpen();return await new Promise(res=>{const tx=db.transaction('kv','readonly');const rq=tx.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(undefined)})}catch(e){return undefined}}
async function idbDel(k){try{const db=await idbOpen();return await new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=res;tx.onerror=res})}catch(e){}}
async function rememberFileHandle(h){if(h&&h.name)await idbSet('fileHandle',h)}
function renderBanners(){
  let html='';
  if(bannerState.fileName)html+=`<div class="banner"><span>Your database file <b>${esc(bannerState.fileName)}</b> is remembered from last time. Reconnect to load its latest contents (including edits made in Excel) and turn Save back into one-click overwrite.</span><button class="btn btn-primary btn-sm" data-action="reconnectFile">Reconnect ${esc(bannerState.fileName)}</button><button class="btn btn-quiet btn-sm" data-action="forgetFile">Forget this file</button></div>`;
  if(bannerState.backup)html+=`<div class="banner"><span>${bannerState.backup.clean?'Your last session was restored automatically from the browser backup.':'<b>Unsaved work</b> from your last session was restored from the browser backup — Save or Export to keep it.'}</span><button class="btn btn-quiet btn-sm" data-action="dismissBanner">OK</button></div>`;
  el('banner').innerHTML=html;
}
async function checkBackup(){
  let b=null;try{b=JSON.parse(localStorage.getItem(BACKUP_KEY)||'null')}catch(e){}
  if(b&&b.csv&&!roles.length&&!people.length){
    if(loadCSV(b.csv)){
      bannerState.backup=b;
      el('dbStatus').textContent=b.fileName?b.fileName+' (from browser backup)':'Restored from browser backup';
      if(b.clean)markClean('Last session restored');else markDirty();
    }
  }
  try{
    const h=await idbGet('fileHandle');
    if(h&&h.name){reconnectHandle=h;bannerState.fileName=h.name}
  }catch(e){}
  renderBanners();
}
async function reconnectStoredFile(){
  const h=reconnectHandle;
  if(!h){notice('WARN','No remembered file.');return}
  try{
    if(h.queryPermission&&(await h.queryPermission({mode:'readwrite'}))!=='granted'){
      if(!h.requestPermission||(await h.requestPermission({mode:'readwrite'}))!=='granted'){notice('ERR','Permission to the file was not granted — use Open CSV instead.');return}
    }
    if(dirty&&!confirm('Loading the file will replace the unsaved changes currently on screen. Continue?'))return;
    const f=await h.getFile();
    if(loadCSV(await f.text())){
      fileHandle=h;
      el('dbStatus').textContent=f.name;
      bannerState.fileName='';bannerState.backup=null;
      renderBanners();
      notice('OK','Reconnected to '+f.name+' — Save now writes straight back to it.');
      rememberFileHandle(h);
    }
  }catch(e){console.warn(e);notice('ERR','Could not reopen the remembered file — open it manually with Open CSV.')}
}
function forgetStoredFile(){reconnectHandle=null;bannerState.fileName='';idbDel('fileHandle');renderBanners();setStatus('Forgot the remembered file')}

/* ---------- undo & baseline ---------- */
function takeSnapshot(){return{roles:deepClone(roles),people:deepClone(people),successors:deepClone(successors),rules:deepClone(rules),history:deepClone(history),boards:deepClone(boards),customFieldValues:deepClone(customFieldValues),fieldTypes:deepClone(fieldTypes),insightWidgets:deepClone(insightWidgets),activeTab}}
function restoreSnapshot(s){roles=s.roles;people=s.people;successors=s.successors;rules=s.rules;history=s.history;boards=s.boards;customFieldValues=s.customFieldValues||{};fieldTypes=s.fieldTypes||fieldTypes;insightWidgets=s.insightWidgets||insightWidgets;activeTab=s.activeTab||'MASTER';render()}
function pushUndo(action='Change'){undoStack.push({action,snapshot:takeSnapshot()});if(undoStack.length>40)undoStack.shift();markDirty()}
function undoLastAction(){const last=undoStack.pop();if(!last){notice('WARN','Nothing to undo.');return}restoreSnapshot(last.snapshot);markDirty();notice('OK','Undid: '+last.action)}
function captureImportBaseline(){importBaseline={roles:deepClone(roles),successors:deepClone(successors),boards:deepClone(boards)}}
function resetOrgChanges(){
  if(!importBaseline){notice('WARN','No imported baseline found. Open a CSV first.');return}
  if(!confirm('Return imported roles and successor slates to the import baseline? New rules, new roles, and new candidates are kept.'))return;
  pushUndo('Reset org changes');
  const baseRoles=new Map(importBaseline.roles.map(r=>[r.id,r]));
  roles=roles.map(r=>baseRoles.has(r.id)?deepClone(baseRoles.get(r.id)):r);
  successors=deepClone(importBaseline.successors);
  roles.forEach(r=>normalizeRanks(r.id));
  log('Reset Org Changes','Restored imported role incumbents and successor slates.');
  notice('OK','Org changes were reset to the imported baseline.');
  render();
}
function clearAll(){
  if(!confirm('Clear ALL data (roles, people, slates, rules, history)? You can Undo this.'))return;
  pushUndo('Clear all data');
  roles=[];people=[];successors=[];rules=[];history=[];messages=[];customFieldValues={};boards=systemBoards();activeTab='MASTER';
  notice('WARN','All data cleared. Use Undo to bring it back.');
  render();
}

/* ---------- custom dropdown values ---------- */
function fieldKeyFromSelectId(id){return{pReady:'readiness',pSource:'source',pType:'candidateType',pPerf:'performance',pPot:'potential',pRet:'retentionRisk',pMob:'mobility',pConf:'confidence',pJob:'jobLevel',rLevel:'level',rDept:'department',pDept:'department',pLoc:'location',rBoard:'board',rManager:'managerRole',rRisk:'risk',rCrit:'criticality'}[id]||id||'custom'}
function addCustomValue(field,value){field=field||'custom';value=String(value||'').trim();if(!value)return;if(!customFieldValues[field])customFieldValues[field]=[];if(!customFieldValues[field].includes(value))customFieldValues[field].push(value)}
function getFieldValue(p,s,field){
  if(field in (p||{}))return p[field];
  if(field in (s||{}))return s[field];
  const px=(p||{})._x||{};if(field in px)return px[field];
  const sx=(s||{})._x||{};if(field in sx)return sx[field];
  return '';
}
function valuesForField(field,base=[]){
  const data=[];
  const pIdx=new Map(people.map(p=>[p.id,p]));
  people.forEach(p=>{const val=getFieldValue(p,null,field);if(String(val||'').trim())data.push(String(val).trim())});
  successors.forEach(s=>{const val=getFieldValue(pIdx.get(s.personId)||{},s,field);if(String(val||'').trim())data.push(String(val).trim())});
  roles.forEach(r=>{
    if(field==='department'&&r.department)data.push(r.department);
    if(field==='level'&&r.level)data.push(r.level);
    if(field==='risk'&&r.risk)data.push(r.risk);
    if(field==='criticality'&&r.criticality)data.push(r.criticality);
  });
  return [...new Set([...(base||[]),...(customFieldValues[field]||[]),...data].filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));
}
function departments(){return valuesForField('department',[])}
function levels(){
  const all=valuesForField('level',DEFAULT_LEVELS);
  const known=DEFAULT_LEVELS.filter(l=>all.includes(l));
  const custom=all.filter(l=>!DEFAULT_LEVELS.includes(l));
  return [...known,...custom];
}
function customSelectOptions(options,selected,field=''){
  let opts=field?valuesForField(field,options):[...options];
  if(selected&&!opts.includes(selected))opts.unshift(selected);
  opts=[...new Set(opts.filter(Boolean))];
  return '<option value=""></option>'+opts.map(o=>`<option value="${attr(o)}" ${o===selected?'selected':''}>${esc(o)}</option>`).join('')+'<option value="__ADD__">+ Add value&hellip;</option>';
}

/* ---------- small "add value" modal ---------- */
function openSmallValueBox(title,callback){
  const old=el('smallValueModal');if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.id='smallValueModal';wrap.className='modal-backdrop';
  wrap.innerHTML=`<div class="modal"><h3>${esc(title||'Add value')}</h3><div class="hint" style="margin-bottom:10px">The new value becomes selectable anywhere this field is used, and is saved in the CSV.</div><input id="smallValueInput" placeholder="Type new value&hellip;" style="margin-bottom:12px"><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn btn-quiet" id="smallCancel">Cancel</button><button type="button" class="btn btn-primary" id="smallAdd">Add</button></div></div>`;
  document.body.appendChild(wrap);
  const input=wrap.querySelector('#smallValueInput');
  setTimeout(()=>input.focus(),40);
  wrap.querySelector('#smallCancel').onclick=()=>wrap.remove();
  wrap.addEventListener('mousedown',e=>{if(e.target===wrap)wrap.remove()});
  wrap.querySelector('#smallAdd').onclick=()=>{const value=input.value.trim();if(!value)return;wrap.remove();callback(value)};
  input.addEventListener('keydown',e=>{if(e.key==='Enter')wrap.querySelector('#smallAdd').click();if(e.key==='Escape')wrap.remove()});
}

function makeUniqueRoleId(title){const base='R-'+(String(title||'ROLE').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'')||'ROLE');let id=base,i=2;while(role(id)){id=base+'-'+i;i++}return id}

function handleCustomSelect(sel){
  if(sel.value!=='__ADD__'){sel.dataset.previous=sel.value;return}
  const field=fieldKeyFromSelectId(sel.id);
  const previous=sel.dataset.previous||'';
  if(sel.id==='rManager'){
    openSmallValueBox('Add manager role',value=>{
      pushUndo('Add manager role option');
      const id=makeUniqueRoleId(value);
      const dept=v('rDept')&&v('rDept')!=='__ADD__'?v('rDept'):'';
      roles.push({id,title:value,level:v('rLevel')&&v('rLevel')!=='__ADD__'?v('rLevel'):'Manager',department:dept,boardId:v('rBoard')&&v('rBoard')!=='__ADD__'?v('rBoard'):'',managerRoleId:'',incumbentPersonId:'',incumbentName:'VACANT',risk:'Medium',criticality:'Medium',owner:'',status:'Manager Role Added',sortOrder:roles.length+1});
      const opt=document.createElement('option');opt.value=id;opt.textContent=value+' ('+id+')';
      sel.insertBefore(opt,sel.querySelector('option[value="__ADD__"]'));
      sel.value=id;sel.dataset.previous=id;
      log('Manager Role Added',value+' added from role form');
      notice('OK','Manager role added and selected: '+value);
    });
    sel.value=previous;return;
  }
  openSmallValueBox('Add value',value=>{
    const terr=typedValueError(field,value);
    if(terr){notice('ERR',terr);return}
    addCustomValue(field,value);
    markDirty();
    if(sel.id==='rBoard'){
      const id='BOARD-'+(value.toUpperCase().replace(/[^A-Z0-9]+/g,'-')||uid('X'));
      if(!boards.some(b=>b.id===id))boards.push({id,name:value});
      const opt=document.createElement('option');opt.value=id;opt.textContent=value;
      sel.insertBefore(opt,sel.querySelector('option[value="__ADD__"]'));sel.value=id;
    }else{
      const opt=document.createElement('option');opt.value=value;opt.textContent=value;
      sel.insertBefore(opt,sel.querySelector('option[value="__ADD__"]'));sel.value=value;
    }
    sel.dataset.previous=sel.value;
    refreshOpenRuleValueControls(field);
  });
  sel.value=previous;
}
function refreshOpenRuleValueControls(field){document.querySelectorAll('.condition-row').forEach(row=>{if(row.querySelector('.condField')?.value===field)updateConditionValue(row.querySelector('.condField'))})}

/* =====================================================================
   CSV engine — format identical to v26
   ===================================================================== */
function parseCSV(text){
  const rows=[];let row=[],val='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c==='"'&&q&&n==='"'){val+='"';i++}
    else if(c==='"')q=!q;
    else if(c===','&&!q){row.push(val);val=''}
    else if((c==='\n'||c==='\r')&&!q){if(val||row.length){row.push(val);rows.push(row);row=[];val=''}if(c==='\r'&&n==='\n')i++}
    else val+=c;
  }
  if(val||row.length)rows.push([...row,val]);
  return rows;
}
function csvEsc(v){const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}

function loadCSV(text){
  if(String(text||'').length>MAX_CSV_MB*1024*1024){notice('ERR',`This CSV is over ${MAX_CSV_MB}MB — split it or trim old history rows before opening.`);return false}
  const rows=parseCSV(String(text||''));
  if(rows.length<2){notice('ERR','CSV appears empty or invalid — nothing was loaded.');return false}
  const headers=rows[0].map(h=>h.trim());
  if(!headers.includes('recordType')){notice('ERR','This does not look like a Succession Planner CSV (missing recordType column).');return false}
  // columns this app doesn't know yet are preserved on each record and written back on save
  const extraCols=headers.filter(h=>h&&!CSV_HEADERS.includes(h));
  const grabExtras=o=>extraCols.length?Object.fromEntries(extraCols.map(h=>[h,o[h]||''])):undefined;
  boards=systemBoards();roles=[];people=[];successors=[];rules=[];history=[];messages=[];customFieldValues={};chessDefaultFields=null;fieldTypes={};treeView=null;insightWidgets=[];
  roleFilters=[{field:'level',values:[]},{field:'department',values:[]},{field:'risk',values:[]},{field:'readiness',values:[]}];
  pieceFilters=[{field:'department',values:[]}];filterPop=null;
  rows.slice(1).forEach(row=>{
    const o={};headers.forEach((h,i)=>o[h]=row[i]||'');
    if(!Object.values(o).some(x=>String(x).trim()))return;
    if(o.recordType==='BOARD'&&o.boardId&&!boards.some(b=>b.id===o.boardId))boards.push({id:o.boardId,name:o.boardName||prettyBoardName(o.boardId)});
    if(o.recordType==='PERSON'&&o.personId)people.push({id:o.personId,name:o.personName,title:o.personTitle,department:o.personDepartment,email:o.personEmail,location:o.location,jobLevel:o.jobLevel,performance:o.performance,potential:o.potential,retentionRisk:o.retentionRisk,mobility:o.mobility,criticalExperience:o.criticalExperience,skills:o.skills,readiness:o.readiness||'1-2 Years',source:o.source||'Internal',candidateType:o.candidateType||'Successor',confidence:o.confidence||'Medium',notes:o.notes,_x:grabExtras(o)});
    if(o.recordType==='ROLE'&&o.roleId){
      roles.push({id:o.roleId,title:o.roleTitle,level:o.level||'VP',department:o.department,boardId:o.boardId,managerRoleId:o.managerRoleId,incumbentPersonId:o.incumbentPersonId,incumbentName:o.incumbentName,risk:o.risk||'Medium',criticality:o.criticality||'High',owner:o.owner,status:o.status||'Active Plan',sortOrder:Number(o.sortOrder||999),_x:grabExtras(o)});
      // a role naming a board that has no BOARD row auto-creates the tab — HR can add tabs straight from the CSV
      if(o.boardId&&!boards.some(b=>b.id===o.boardId))boards.push({id:o.boardId,name:prettyBoardName(o.boardId)});
    }
    if(o.recordType==='SUCCESSOR'&&o.successorRoleId&&o.personId)successors.push({id:o.roleId||uid('S'),roleId:o.successorRoleId,personId:o.personId,readiness:o.readiness||'1-2 Years',source:o.source||'Internal',candidateType:o.candidateType||'Successor',confidence:o.confidence||'Medium',ranking:Number(o.ranking||999),notes:o.notes,approved:String(o.approved).toLowerCase()==='true',autoMoveQueued:String(o.autoMoveQueued).toLowerCase()==='true',_x:grabExtras(o)});
    if(o.recordType==='RULE'&&o.ruleId){
      let op=o.ruleOperator;
      // a BLOCK rule with no operator and no target role can only mean "cannot change role"
      if((o.ruleType||'FIELD_RULE')==='BLOCK'&&!op&&!o.ruleTargetRoleId)op='cannot change role';
      rules.push({id:o.ruleId,name:o.ruleName,type:o.ruleType||'FIELD_RULE',scope:o.ruleScope||'Candidate',field:o.ruleField,operator:op,value:o.ruleValue,personId:o.rulePersonId,targetRoleId:o.ruleTargetRoleId,altPersonId:o.ruleAltPersonId,severity:o.ruleSeverity||'Needs Review',message:o.ruleMessage,enabled:String(o.ruleEnabled).toLowerCase()!=='false'});
    }
    if(o.recordType==='HISTORY'&&o.historyId)history.push({id:o.historyId,date:o.historyDate,action:o.historyAction,details:o.historyDetails});
    if(o.recordType==='SETTING'&&o.settingKey==='customFieldValues'){try{customFieldValues=JSON.parse(o.settingValue||'{}')||{}}catch(e){customFieldValues={}}}
    if(o.recordType==='SETTING'&&o.settingKey==='chessFields'){try{const f=JSON.parse(o.settingValue||'null');if(Array.isArray(f))chessDefaultFields=f}catch(e){}}
    if(o.recordType==='SETTING'&&o.settingKey==='fieldTypes'){try{const f=JSON.parse(o.settingValue||'{}');if(f&&typeof f==='object')fieldTypes=f}catch(e){}}
    if(o.recordType==='SETTING'&&o.settingKey==='insightWidgets'){try{const f=JSON.parse(o.settingValue||'[]');if(Array.isArray(f))insightWidgets=f.slice(0,MAX_WIDGETS)}catch(e){}}
  });
  consolidateDuplicateData(true);
  validateDataLinks();
  captureImportBaseline();
  undoStack=[];selectedPersonId='';activeTab='MASTER';
  markClean('CSV loaded — baseline captured');
  render();
  return true;
}
function extraColumnNames(data){
  const d=data||{people,roles,successors};
  const s=new Set();
  [...(d.people||[]),...(d.roles||[]),...(d.successors||[])].forEach(e=>Object.keys(e._x||{}).forEach(k=>{if(k&&!CSV_HEADERS.includes(k))s.add(k)}));
  return[...s].sort((a,b)=>a.localeCompare(b));
}
function prettyBoardName(id){return String(id||'').replace(/^BOARD[-_]?/i,'').replace(/[-_]+/g,' ').trim().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())||String(id)}
function toCSV(data){
  if(!data)consolidateDuplicateData(false);
  const d=data||{boards,people,roles,successors,rules,history,customFieldValues,chessFields:chessDefaultFields||CHESS_DEFAULT_FIELDS};
  const extras=extraColumnNames(d);
  const headers=[...CSV_HEADERS,...extras];
  const rows=[headers.map(csvEsc).join(',')];
  const put=(o,x)=>rows.push(headers.map(h=>csvEsc(CSV_HEADERS.includes(h)?o[h]:(x||{})[h])).join(','));
  (d.boards||[]).filter(b=>!SYSTEM_BOARDS.includes(b.id)).forEach(b=>put({recordType:'BOARD',boardId:b.id,boardName:b.name}));
  (d.people||[]).forEach(p=>put({recordType:'PERSON',personId:p.id,personName:p.name,personTitle:p.title,personDepartment:p.department,personEmail:p.email,location:p.location,jobLevel:p.jobLevel,performance:p.performance,potential:p.potential,retentionRisk:p.retentionRisk,mobility:p.mobility,criticalExperience:p.criticalExperience,skills:p.skills,readiness:p.readiness,source:p.source,candidateType:p.candidateType,confidence:p.confidence,notes:p.notes},p._x));
  (d.roles||[]).forEach(r=>put({recordType:'ROLE',boardId:r.boardId,roleId:r.id,roleTitle:r.title,level:r.level,department:r.department,managerRoleId:r.managerRoleId,incumbentPersonId:r.incumbentPersonId,incumbentName:r.incumbentName,risk:r.risk,criticality:r.criticality,owner:r.owner,status:r.status,sortOrder:r.sortOrder},r._x));
  (d.successors||[]).forEach(s=>put({recordType:'SUCCESSOR',roleId:s.id,successorRoleId:s.roleId,personId:s.personId,readiness:s.readiness,source:s.source,candidateType:s.candidateType,confidence:s.confidence,ranking:s.ranking,notes:s.notes,approved:s.approved,autoMoveQueued:s.autoMoveQueued},s._x));

/* ---------- data hygiene ---------- */
function isEmergencyCandidate(s){return String(s?.candidateType||'').toLowerCase().includes('emergency')}

function consolidateDuplicateData(showNotice=false){
  const pMap=new Map();
  people.forEach(p=>{if(!p.id)return;if(!pMap.has(p.id))pMap.set(p.id,p);else{const base=pMap.get(p.id);Object.keys(p).forEach(k=>{if((base[k]===undefined||base[k]==='')&&p[k])base[k]=p[k]})}});
  people=[...pMap.values()];
  const groups=new Map();
  successors.forEach(s=>{const key=`${s.roleId}||${s.personId}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s)});
  const out=[];let dups=0;
  groups.forEach(items=>{
    if(items.length===1){out.push(items[0]);return}
    dups+=items.length-1;
    const primary=items.filter(x=>!isEmergencyCandidate(x)).sort((a,b)=>(+a.ranking||999)-(+b.ranking||999))[0]||items[0];
    const m={...primary};
    m.readiness=bestReadiness(items.map(x=>x.readiness));
    m.candidateType=[...new Set(items.map(x=>x.candidateType).filter(Boolean))].join(' / ');
    m.approved=items.some(x=>x.approved);
    m.autoMoveQueued=items.some(x=>x.autoMoveQueued);
    out.push(m);
  });

  roles.forEach(r=>normalizeRanks(r.id));
  if(showNotice&&dups)notice('WARN',`${dups} duplicate candidate assignment(s) were merged.`);
}
function validateDataLinks(){
  const missingPeople=[...new Set(successors.filter(s=>!person(s.personId)).map(s=>s.personId).filter(Boolean))];
  const missingRoles=[...new Set(successors.filter(s=>!role(s.roleId)).map(s=>s.roleId).filter(Boolean))];
  if(missingPeople.length)notice('ERR',`Data mismatch: successor person IDs missing from People: ${missingPeople.slice(0,5).join(', ')}`);
  if(missingRoles.length)notice('ERR',`Data mismatch: successor role IDs missing from Roles: ${missingRoles.slice(0,5).join(', ')}`);
}

function moveRank(sid,delta){

/* =====================================================================
   Rules engine
   ===================================================================== */
function compare(val,op,w){
  const val2=norm(val),wn=norm(w);
  const list=String(w||'').split('|').map(norm).filter(Boolean);
  if(op==='equals')return val2===wn;
  if(op==='not equals')return val2!==wn;
  if(op==='contains')return !!wn&&val2.includes(wn);
  if(op==='not contains')return !wn||!val2.includes(wn);
  if(op==='greater than'||op==='less than'){
    const a=parseFloat(String(val??'').replace(/,/g,'')),b=parseFloat(String(w??'').replace(/,/g,''));

function safeJSON(value,fallback){try{return JSON.parse(value||'')}catch(e){return fallback}}

function evaluateRules(s){

      // the rule fires on anyone who fails at least one.

      const scope=String(rule.targetRoleId||'').split('|').filter(Boolean);

let roleFilters=[{field:'level',values:[]},{field:'department',values:[]},{field:'risk',values:[]},{field:'readiness',values:[]}];

  const txt=!f.values.length?'All':f.values.length===1?f.values[0]:`${f.values[0]} +${f.values.length-1}`;
  const open=filterPop&&filterPop.scope===scope&&filterPop.field===f.field;
  return `<div class="fchip ${f.values.length?'active':''}">
    <button type="button" class="fchip-btn" data-action="fchipOpen" data-scope="${scope}" data-field="${attr(f.field)}">${esc(label)}: <b>${esc(txt)}</b> <span class="caret">&#9662;</span></button>
    <button type="button" class="fchip-x" data-action="fchipRemove" data-scope="${scope}" data-field="${attr(f.field)}" title="Remove this filter">&#10005;</button>
    ${open?filterPopHtml(scope,f):''}
  </div>`;
}
function filterPopHtml(scope,f){
  const choices=filterValueChoices(scope,f.field);
  const sel=new Set(f.values);
  return `<div class="fchip-pop">
    <div class="fchip-pop-head"><span>${plur(choices.length,'value')} — pick any</span><button type="button" class="linklike" data-action="fchipClear" data-scope="${scope}" data-field="${attr(f.field)}">All (clear)</button></div>
    ${choices.map(c=>{const id=checkboxId();return `<label for="${id}"><input id="${id}" type="checkbox" class="fchipVal" data-scope="${scope}" data-field="${attr(f.field)}" value="${attr(c)}" ${sel.has(c)?'checked':''}>${esc(c)}</label>`}).join('')||'<div class="hint">No values in the data yet.</div>'}
  </div>`;
}
function filterAddPopHtml(scope){
  const active=new Set(filtersOf(scope).map(f=>f.field));
  const builtins=filterBuiltins(scope).filter(([f])=>!active.has(f));
  const customs=customFilterFields(scope).filter(f=>!active.has(f)&&!filterBuiltins(scope).some(([b])=>b===f));
  const btn=(f,label)=>`<button type="button" class="pop-field" data-action="fchipAddField" data-scope="${scope}" data-field="${attr(f)}">${esc(label)}</button>`;
  return `<div class="fchip-pop">
    ${builtins.length?`<div class="pop-group">Fields</div>${builtins.map(([f,l])=>btn(f,l)).join('')}`:''}
    ${customs.length?`<div class="pop-group">Custom fields (with values)</div>${customs.map(f=>btn(f,f)).join('')}`:''}
    ${!builtins.length&&!customs.length?'<div class="hint">Every available field is already a filter. Custom fields appear here once at least one record has a value.</div>':''}
  </div>`;
}
function filterBarHtml(scope){
  const addOpen=filterPop&&filterPop.scope===scope&&filterPop.field==='__add__';
  return filtersOf(scope).map(f=>filterChipHtml(scope,f)).join('')+
    `<div class="fchip" style="border:none;background:none"><button type="button" class="fchip-add" data-action="fchipAdd" data-scope="${scope}">+ Filter</button>${addOpen?filterAddPopHtml(scope):''}</div>`;
}
function fillFilters(){
  const fc=el('filterChips'),pf=el('pieceFilters');
  if(fc)fc.innerHTML=filterBarHtml('role');
  if(pf)pf.innerHTML=filterBarHtml('piece');
}
function filterFieldValOf(scope,rec,field){
  const builtin=filterBuiltins(scope).some(([f])=>f===field);
  return String((builtin?rec[field]:(rec._x||{})[field])??'').trim();
}
function passesFilters(scope,rec,byRole){
  return filtersOf(scope).every(f=>{
    if(!f.values.length)return true;
    if(scope==='role'&&f.field==='readiness'){
      const ss=(byRole&&byRole.get(rec.id))||successors.filter(s=>s.roleId===rec.id);
      return f.values.some(val=>val==='No Candidate'?ss.length===0:ss.some(s=>s.readiness===val));
    }
    return f.values.includes(filterFieldValOf(scope,rec,f.field));
  });
}

function filteredRoles(){
  const q=norm(v('search'));
  const boardObj=boards.find(b=>b.id===activeTab);
  const pIdx=new Map(people.map(p=>[p.id,p]));
  const nm=id=>pIdx.get(id)?.name||'';
  const byRole=new Map();
  successors.forEach(s=>{const arr=byRole.get(s.roleId);if(arr)arr.push(s);else byRole.set(s.roleId,[s])});
  return roles.filter(r=>{
    const ss=byRole.get(r.id)||[];
    const txt=[r.id,r.title,r.level,r.department,r.incumbentName,nm(r.incumbentPersonId),ss.map(s=>nm(s.personId)).join(' ')].join(' ').toLowerCase();
    const onBoard=SYSTEM_BOARDS.includes(activeTab)||r.boardId===activeTab||boardObj?.name===r.department;
    return onBoard&&txt.includes(q)&&passesFilters('role',r,byRole);
  });
}

/* ---------- org tree ---------- */
function computeTreeParents(){
  const lvls=levels();
  const li=l=>{const i=lvls.indexOf(l);return i<0?lvls.length:i};
  const parents=new Map(); // roleId -> {id, inferred}
  roles.forEach(r=>{
    if(r.managerRoleId&&r.managerRoleId!==r.id&&role(r.managerRoleId)){parents.set(r.id,{id:r.managerRoleId,inferred:false});return}
    const my=li(r.level);
    let best=null;
    // closest higher level within the same department, e.g. a VP slots under the SVP
    roles.forEach(c=>{
      if(c.id===r.id)return;
      const cl=li(c.level);
      if(cl>=my||norm(c.department)!==norm(r.department))return;
      if(!best||cl>best.lvl||(cl===best.lvl&&(+c.sortOrder||999)<best.sort))best={id:c.id,lvl:cl,sort:+c.sortOrder||999};
    });
    if(!best)roles.forEach(c=>{ // otherwise hang under the topmost role overall
      if(c.id===r.id)return;
      const cl=li(c.level);
      if(cl>=my)return;
      if(!best||cl<best.lvl||(cl===best.lvl&&(+c.sortOrder||999)<best.sort))best={id:c.id,lvl:cl,sort:+c.sortOrder||999};
    });
    if(best)parents.set(r.id,{id:best.id,inferred:true});
  });
  return parents;
}
function renderTree(){
  const parents=computeTreeParents();
  const inferredCount=[...parents.values()].filter(p=>p.inferred).length;
  setView('Master Org Tree',
    'Reporting lines follow each role’s Manager Role field. Roles without one are placed by level within their department (dashed).'+(inferredCount?' Use the button to make those lines permanent.':'')+' Click a role to open it.',
    inferredCount?`<button class="btn btn-quiet btn-sm" data-action="applyInferred">Apply ${inferredCount} inferred line${inferredCount===1?'':'s'}</button>`:'');
  const kidsMap=new Map();
  roles.forEach(r=>{const p=parents.get(r.id);if(p){const a=kidsMap.get(p.id);if(a)a.push(r);else kidsMap.set(p.id,[r])}});
  kidsMap.forEach(a=>a.sort((x,y)=>(+x.sortOrder||999)-(+y.sortOrder||999)));
  const roots=roles.filter(r=>!parents.has(r.id));
  if(!roots.length){
    el('mainView').innerHTML=roles.length
      ?emptyState('Could not find a top role','Reporting lines seem to form a loop — open a role and fix its Manager Role.')
      :emptyState('No data yet','Open your CSV database or add your first role.',`<button class="btn btn-quiet" data-action="openCSV">Open CSV</button> <button class="btn btn-primary" data-action="openRoleDrawerNew" style="margin-left:6px">+ Add Role</button>`);
    return;
  }
  el('mainView').innerHTML=`<div class="tree" id="treeViewport">
    <div class="tree-canvas" id="treeCanvas"><div class="tree-item" style="flex-direction:row;align-items:flex-start">${roots.map(r=>treeNode(r,kidsMap,parents,new Set())).join('')}</div></div>
    <div class="tree-controls">
      <button class="btn btn-quiet btn-sm" data-action="treeZoom" data-delta="1" title="Zoom in">+</button>
      <button class="btn btn-quiet btn-sm" data-action="treeZoom" data-delta="-1" title="Zoom out">&minus;</button>
      <button class="btn btn-quiet btn-sm" data-action="treeReset" title="Fit and center">Fit</button>
    </div>
    <div class="tree-hint">Scroll to zoom · hold and drag to move · click a role to open it</div>
  </div>`;
  initTreeView();
}
function applyTreeView(){
  const c=el('treeCanvas');
  if(c&&treeView)c.style.transform=`translate(${treeView.x}px,${treeView.y}px) scale(${treeView.scale})`;
}
function fitTreeView(){
  const vp=el('treeViewport'),c=el('treeCanvas');
  if(!vp||!c)return;
  const cw=Math.max(1,c.offsetWidth),ch=Math.max(1,c.offsetHeight);
  const vw=vp.clientWidth,vh=vp.clientHeight;
  // fit the whole tree when possible, but never below a readable zoom —
  // huge trees open centered on the top of the chart instead of ant-sized
  const fit=Math.min(1,(vw-30)/cw,(vh-30)/ch)*0.96;
  const s=Math.max(0.5,fit);
  treeView={x:(vw-cw*s)/2,y:fit>=0.5?Math.max(14,(vh-ch*s)/2):14,scale:s};
  applyTreeView();
}
function initTreeView(){
  const vp=el('treeViewport');
  if(!vp)return;
  if(treeView)applyTreeView();else fitTreeView();
  vp.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=vp.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const f=e.deltaY<0?1.12:0.89;
    const ns=Math.min(2.5,Math.max(0.15,treeView.scale*f));
    const k=ns/treeView.scale;
    treeView={x:mx-(mx-treeView.x)*k,y:my-(my-treeView.y)*k,scale:ns};
    applyTreeView();
  },{passive:false});
  let drag=null;
  vp.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('.tree-controls'))return;
    drag={sx:e.clientX,sy:e.clientY,ox:treeView.x,oy:treeView.y,moved:false,pid:e.pointerId,captured:false};
    vp.classList.add('dragging');
  });
  vp.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(Math.abs(dx)+Math.abs(dy)>4){
      drag.moved=true;
      // capture only once a real drag starts — capturing on pointerdown would
      // retarget the click to the viewport and break opening roles
      if(!drag.captured){try{vp.setPointerCapture(drag.pid)}catch(err){}drag.captured=true}
    }
    if(drag.moved){treeView.x=drag.ox+dx;treeView.y=drag.oy+dy;applyTreeView()}
  });
  const endDrag=()=>{
    if(drag&&drag.moved){treeClickSuppressed=true;setTimeout(()=>{treeClickSuppressed=false},50)}
    drag=null;vp.classList.remove('dragging');
  };
  vp.addEventListener('pointerup',endDrag);
  vp.addEventListener('pointercancel',endDrag);
  vp.addEventListener('click',e=>{if(treeClickSuppressed){e.stopPropagation();e.preventDefault()}},true);
}
function treeZoomBy(delta){
  const vp=el('treeViewport');
  if(!vp||!treeView)return;
  const f=delta>0?1.25:0.8;
  const ns=Math.min(2.5,Math.max(0.15,treeView.scale*f));
  const k=ns/treeView.scale;
  const cx=vp.clientWidth/2,cy=vp.clientHeight/2;
  treeView={x:cx-(cx-treeView.x)*k,y:cy-(cy-treeView.y)*k,scale:ns};
  applyTreeView();
}
function treeNode(r,kidsMap,parents,seen){
  if(seen.has(r.id))return '';
  seen.add(r.id);
  const kids=kidsMap.get(r.id)||[];
  const vac=isRoleVacant(r);
  const inf=parents.get(r.id)?.inferred;
  return `<div class="tree-item"><div class="node ${inf?'inferred':''}" data-action="openRole" data-role-id="${attr(r.id)}"><b>${esc(r.title)}</b><div class="nsub ${vac?'nvac':''}">${vac?'VACANT':esc(personName(r.incumbentPersonId,r.incumbentName||'VACANT'))}</div><div class="nsub">${esc(r.level||'')}${r.department?' · '+esc(r.department):''}</div>${inf?'<div class="ninf">placed by level — no manager set</div>':''}</div>${kids.length?'<div class="children">'+kids.map(k=>treeNode(k,kidsMap,parents,seen)).join('')+'</div>':''}</div>`;
}
function applyInferredLines(){
  const parents=computeTreeParents();
  const inferred=[...parents.entries()].filter(([,p])=>p.inferred);
  if(!inferred.length){notice('WARN','Nothing to apply — every role already has a manager.');return}
  pushUndo('Apply inferred reporting lines');
  inferred.forEach(([rid,p])=>{const r=role(rid);if(r)r.managerRoleId=p.id});
  log('Hierarchy Updated',`${inferred.length} inferred reporting line(s) applied`);
  notice('OK',`${inferred.length} reporting line(s) written onto the roles. Save the CSV to keep them.`);
  render();
}

/* ---------- rules ---------- */
function ruleSummary(r){
  const roleNames=ids=>{const names=ids.map(id=>role(id)?.title||id);return names.slice(0,3).join(', ')+(names.length>3?` +${names.length-3} more`:'')};
  if(r.type==='BLOCK'){
    const who=r.personId?personName(r.personId,r.personId):'Any person';
    const targets=String(r.targetRoleId||'').split('|').filter(Boolean);
    return r.operator==='cannot change role'?`${who} cannot change role`:`${who} cannot move to ${targets.length?roleNames(targets):'(no target role set)'}`;
  }
  if(r.type==='AUTO_BACKFILL'){
    const cfg=autoRuleConfig(r);
    if(cfg.mode==='custom'||(cfg.autoTypes||[]).includes('Custom'))return `Custom backfill chart (${(cfg.customMappings||[]).length} mapping${(cfg.customMappings||[]).length===1?'':'s'})`;
    return `Backfill vacant roles from type: ${(cfg.autoTypes||[]).join(', ')||'?'}`;
  }
  const conds=ruleConditions(r);
  const scope=String(r.targetRoleId||'').split('|').filter(Boolean);
  return (conds.length?'Eligible only if '+conds.map(c=>`${c.field} ${c.operator} ${String(c.value||'').split('|').join(', ')}`).join(' AND '):'—')
    +(r.type==='FIELD_RULE'&&scope.length?` — only for ${roleNames(scope)}`:'');
}
