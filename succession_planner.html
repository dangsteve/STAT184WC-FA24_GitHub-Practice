/* ---------- insights ---------- */
function renderInsights(){
  setView('Insights','Bench strength at a glance. The filter bar applies to the standard panels below; your own dashboard widgets always show all data.',
    insightWidgets.length<MAX_WIDGETS?`<button class="btn btn-green btn-sm" data-action="addWidget">+ Add widget</button>`:'');
  const fr=filteredRoles();
  const frIds=new Set(fr.map(r=>r.id));
  const ss=successors.filter(s=>frIds.has(s.roleId));
  const slateSet=new Set(ss.map(s=>s.roleId));
  const readySet=new Set(ss.filter(s=>norm(s.readiness)==='ready now').map(s=>s.roleId));
  const covered=fr.filter(r=>slateSet.has(r.id));
  const readyCovered=fr.filter(r=>readySet.has(r.id));
  const vacant=fr.filter(isRoleVacant);
  const highRisk=fr.filter(r=>['high','critical'].includes(norm(r.risk)));
  const riskGaps=highRisk.filter(r=>!readySet.has(r.id));
  const gaps=fr.filter(r=>!slateSet.has(r.id));
  if(!fr.length){el('mainView').innerHTML=renderWidgetCards()+emptyState('No roles to analyze','Open a CSV or clear the filters.');return}

  const kpis=`<div class="kpis">
    <div class="kpi"><b>${fr.length}</b><small>Roles in view</small></div>
    <div class="kpi"><b>${pct(covered.length,fr.length)}%</b><small>Bench coverage</small><div class="sub">${covered.length} roles with &ge;1 candidate</div></div>
    <div class="kpi"><b>${pct(readyCovered.length,fr.length)}%</b><small>Ready Now coverage</small><div class="sub">${readyCovered.length} roles with a Ready Now candidate</div></div>
    <div class="kpi"><b>${vacant.length}</b><small>Vacant roles</small></div>
    <div class="kpi"><b>${riskGaps.length}</b><small>High-risk gaps</small><div class="sub">high-risk roles with no Ready Now cover</div></div>
  </div>`;

  const byDept={};
  fr.forEach(r=>{const d=r.department||'No department';(byDept[d]=byDept[d]||{total:0,covered:0}).total++;if(slateSet.has(r.id))byDept[d].covered++});
  const deptRows=Object.entries(byDept).sort((a,b)=>b[1].total-a[1].total).slice(0,12).map(([d,x])=>
    `<div class="barrow"><span class="lbl" title="${attr(d)}">${esc(d)}</span><span class="track"><span class="fill" style="width:${pct(x.covered,x.total)}%"></span></span><span class="val">${x.covered}/${x.total}</span></div>`).join('');

  const byReady={};
  ss.forEach(s=>{const k=s.readiness||'Unknown';byReady[k]=(byReady[k]||0)+1});
  const maxReady=Math.max(1,...Object.values(byReady));
  const readyRows=Object.entries(byReady).sort((a,b)=>readinessScore(a[0])-readinessScore(b[0])).map(([k,n])=>
    `<div class="barrow"><span class="lbl">${esc(k)}</span><span class="track"><span class="fill ${norm(k)==='ready now'?'':'dim'}" style="width:${pct(n,maxReady)}%"></span></span><span class="val">${n}</span></div>`).join('');

  const gapTable=list=>list.slice(0,30).map(r=>`<tr class="row-click" data-action="openRole" data-role-id="${attr(r.id)}"><td><b>${esc(r.title)}</b><div style="color:var(--muted);font-size:11px">${esc(r.id)}</div></td><td>${esc(r.level||'')}</td><td>${esc(r.department||'')}</td><td>${riskBadge(r.risk)}</td><td>${isRoleVacant(r)?'<span class="badge red">VACANT</span>':esc(personName(r.incumbentPersonId,r.incumbentName))}</td></tr>`).join('');

  el('mainView').innerHTML=renderWidgetCards()+kpis+
    `<div class="insight-grid">
      <div class="insight-card"><h3>Bench coverage by department</h3>${deptRows||'<div class="hint">No data.</div>'}</div>
      <div class="insight-card"><h3>Candidate readiness mix</h3>${readyRows||'<div class="hint">No slate rows.</div>'}</div>
      <div class="insight-card full-card"><h3>Attention needed &mdash; ${plur(riskGaps.length,'high-risk role')} without Ready Now cover</h3>
        ${riskGaps.length?`<div class="tablebox" style="border:0"><table class="table"><thead><tr><th>Role</th><th>Level</th><th>Department</th><th>Risk</th><th>Incumbent</th></tr></thead><tbody>${gapTable(riskGaps)}</tbody></table></div>`:'<div class="hint">Nothing urgent — every high-risk role has a Ready Now candidate.</div>'}
      </div>
      <div class="insight-card full-card"><h3>Roles with no candidates (${gaps.length})</h3>
        ${gaps.length?`<div class="tablebox" style="border:0"><table class="table"><thead><tr><th>Role</th><th>Level</th><th>Department</th><th>Risk</th><th>Incumbent</th></tr></thead><tbody>${gapTable(gaps)}</tbody></table>${gaps.length>30?`<div class="tfoot-note">Showing 30 of ${gaps.length}.</div>`:''}</div>`:'<div class="hint">Every role in view has at least one candidate.</div>'}
      </div>
    </div>`;
}

<script>
/* =====================================================================
   Drawers & forms
   ===================================================================== */
function isDescendant(childId,ancestorId){let cur=role(childId);const seen=new Set();while(cur&&cur.managerRoleId){if(cur.managerRoleId===ancestorId)return true;if(seen.has(cur.managerRoleId))return false;seen.add(cur.managerRoleId);cur=role(cur.managerRoleId)}return false}
function boardOptions(sel=''){const rows=boards.filter(b=>!SYSTEM_BOARDS.includes(b.id)).map(b=>`<option value="${attr(b.id)}" ${b.id===sel?'selected':''}>${esc(b.name)}</option>`).join('');return '<option value="">No board (show in All Roles)</option>'+rows+'<option value="__ADD__">+ Add board/tab&hellip;</option>'}
function roleOptions(sel=''){return '<option value="">No Manager / Root</option>'+roles.map(r=>`<option value="${attr(r.id)}" ${r.id===sel?'selected':''}>${esc(r.title)} (${esc(r.id)})</option>`).join('')+'<option value="__ADD__">+ Add new manager role&hellip;</option>'}
function targetRoleOptions(sel=''){return '<option value=""></option>'+roles.map(r=>`<option value="${attr(r.id)}" ${r.id===sel?'selected':''}>${esc(r.title)} (${esc(r.id)})</option>`).join('')}
function personOptions(sel=''){return '<option value="">VACANT</option>'+people.map(p=>`<option value="${attr(p.id)}" ${p.id===sel?'selected':''}>${esc(p.name)} (${esc(p.id)})</option>`).join('')}
function rulePersonOptions(sel=''){return '<option value=""></option>'+people.map(p=>`<option value="${attr(p.id)}" ${p.id===sel?'selected':''}>${esc(p.name)} (${esc(p.id)})</option>`).join('')}

/* ---------- user-defined extra fields (future CSV columns) ---------- */
function extraKeysFor(list){const s=new Set();list.forEach(e=>Object.keys(e._x||{}).forEach(k=>s.add(k)));return[...s].sort((a,b)=>a.localeCompare(b))}
function fieldTypeOf(name){return (fieldTypes[name]||{}).type||'text'}
function typedValueError(field,value){
  const val=String(value??'').trim();
  if(!val||!fieldTypes[field])return null;
  const t=fieldTypeOf(field);
  if(t==='number'&&!NUM_RANGE_RE.test(val))return `"${field}" must be a number or a range like 2-5 — got "${value}".`;
  if(t==='boolean'&&!['true','false'].includes(val.toLowerCase()))return `"${field}" must be true or false — got "${value}".`;
  return null;
}
function extraKeysWithRegistry(list,kind){
  const s=new Set(extraKeysFor(list));
  Object.entries(fieldTypes).forEach(([k,def])=>{if(!def||BUILTIN_TYPABLE.includes(k))return;const on=def.on||'all';if(on==='all'||on===kind)s.add(k)});
  return[...s].sort((a,b)=>a.localeCompare(b));
}
function extraFieldInput(k,val){
  const t=fieldTypeOf(k);
  if(t==='boolean')return `<select class="extraField" data-extra-key="${attr(k)}" data-ftype="boolean"><option value=""></option><option ${norm(val)==='true'?'selected':''}>true</option><option ${norm(val)==='false'?'selected':''}>false</option></select>`;
  if(t==='number')return `<input class="extraField" data-extra-key="${attr(k)}" data-ftype="number" value="${attr(val||'')}" placeholder="number or range (2-5)">`;
  return `<input class="extraField" data-extra-key="${attr(k)}" value="${attr(val||'')}">`;
}
function formControl(id,options,selected,field){
  if(fieldTypes[field]){
    const t=fieldTypeOf(field);
    if(t==='boolean')return `<select id="${id}" data-ftype="boolean"><option value=""></option><option ${norm(selected)==='true'?'selected':''}>true</option><option ${norm(selected)==='false'?'selected':''}>false</option></select>`;
    if(t==='number')return `<input id="${id}" data-ftype="number" value="${attr(selected||'')}" placeholder="number or range (2-5)">`;
  }
  return `<select id="${id}" data-change="customSelect">${customSelectOptions(options,selected,field)}</select>`;
}
function extraFieldsSection(entity,list,kind){
  const keys=extraKeysWithRegistry(list,kind);
  const inputs=keys.map(k=>`<div><label>${esc(k)}${fieldTypeOf(k)!=='text'?` <span class="chip">${fieldTypeOf(k)}</span>`:''}</label>${extraFieldInput(k,(entity._x||{})[k]||'')}</div>`).join('');
  return `<div class="extra-fields"><div class="side-title" style="margin-bottom:2px">Additional Fields</div><div class="hint">Your own columns. They are saved as extra columns in the CSV, so the template grows with you — and columns added straight to the CSV show up here too. Set types and bulk-add fields in ⋯ &rarr; Data Tools.</div><div class="grid">${inputs}</div><button type="button" class="btn btn-quiet btn-sm" style="margin-top:10px" data-action="addExtraField">+ Add field</button></div>`;
}
function collectExtras(existing){
  const out={...(existing||{})};
  document.querySelectorAll('#drawerBody .extraField').forEach(i=>{out[i.dataset.extraKey]=i.value});
  return Object.keys(out).length?out:undefined;
}
function addExtraFieldPrompt(){
  const old=el('smallValueModal');if(old)old.remove();
  const kind=el('pId')?'person':'role';
  const wrap=document.createElement('div');
  wrap.id='smallValueModal';wrap.className='modal-backdrop';
  wrap.innerHTML=`<div class="modal"><h3>Add a new field</h3><div class="hint" style="margin-bottom:10px">Becomes a CSV column and appears on every ${kind} from now on. The type works like a cell format in Excel — numeric fields accept numbers or ranges like 2-5.</div>
    <label>Field name</label><input id="smallValueInput" placeholder="e.g. Bonus Target" style="margin-bottom:10px">
    <label>Type</label><select id="smallValueType" style="margin-bottom:12px"><option value="text">Text</option><option value="number">Number</option><option value="boolean">True / False</option></select>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn btn-quiet" id="smallCancel">Cancel</button><button type="button" class="btn btn-primary" id="smallAdd">Add</button></div></div>`;
  document.body.appendChild(wrap);
  const input=wrap.querySelector('#smallValueInput');
  setTimeout(()=>input.focus(),40);
  wrap.querySelector('#smallCancel').onclick=()=>wrap.remove();
  wrap.addEventListener('mousedown',e=>{if(e.target===wrap)wrap.remove()});
  const doAdd=()=>{
    const name=input.value.replace(/[",\r\n]/g,' ').trim();
    const type=wrap.querySelector('#smallValueType').value;
    if(!name)return;
    if(CSV_HEADERS.includes(name)||BUILTIN_TYPABLE.includes(name)){notice('ERR',`"${name}" is already a built-in field.`);return}
    const box=document.querySelector('#drawerBody .extra-fields .grid');
    if(!box){wrap.remove();return}
    if([...box.querySelectorAll('.extraField')].some(i=>i.dataset.extraKey===name)){notice('WARN','That field already exists.');return}
    fieldTypes[name]={type,on:kind};
    markDirty();
    wrap.remove();
    box.insertAdjacentHTML('beforeend',`<div><label>${esc(name)}${type!=='text'?` <span class="chip">${type}</span>`:''}</label>${extraFieldInput(name,'')}</div>`);
    notice('OK',`Field "${name}" (${type==='boolean'?'true/false':type}) added — fill it in and Save.`);
  };
  wrap.querySelector('#smallAdd').onclick=doAdd;
  input.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();if(e.key==='Escape')wrap.remove()});
}

function openAddChooser(){

/* ---------- person drawer ---------- */
function personForm(p){

function personSlateSection(pid){
  const cur=currentRoleForPerson(pid);
  const slates=successors.filter(s=>s.personId===pid).sort((a,b)=>(+a.ranking||999)-(+b.ranking||999));

function openPersonDrawer(id='',fromRole='',defaultType='Successor'){
  currentDrawerPersonId=id||'';
  const p=id?person(id):{id:uid('P'),name:'',title:'',department:'',email:'',location:'',jobLevel:'',readiness:'1-2 Years',source:'Internal',candidateType:defaultType,performance:'Medium',potential:'Medium',retentionRisk:'Low',mobility:'Unknown',confidence:'Medium',criticalExperience:'',skills:'',notes:''};
  if(id&&!p){notice('ERR','Person not found: '+id);return}
  backRoleId=fromRole||'';
  openDrawer(id?p.name:'Add Employee / Candidate',id?`${p.title||'No title'} · ${p.id}`:'Candidate details drive rules and slate placement.',
    personForm(p)+extraFieldsSection(p,people,'person')+(id?personSlateSection(id):''),
    ()=>savePerson(id),
    (id?`<button type="button" class="btn btn-danger" data-action="deletePerson" data-person-id="${attr(id)}">Delete Person</button>`:'')+`<button type="button" class="btn btn-quiet" data-action="openRoleDrawerNew">Add Role</button>`,
    !!fromRole);

function renamePersonRefs(oldId,newId){
  successors.forEach(s=>{if(s.personId===oldId)s.personId=newId});
  roles.forEach(r=>{if(r.incumbentPersonId===oldId)r.incumbentPersonId=newId});
  rules.forEach(r=>{
    if(r.personId===oldId)r.personId=newId;
    if(r.altPersonId===oldId)r.altPersonId=newId;
    if(r.type==='AUTO_BACKFILL'){const cfg=safeJSON(r.value,null);if(cfg&&Array.isArray(cfg.customMappings)){let hit=false;cfg.customMappings.forEach(m=>{if(m.personId===oldId){m.personId=newId;hit=true}});if(hit)r.value=JSON.stringify(cfg)}}
  });
  if(selectedPersonId===oldId)selectedPersonId=newId;
  if(importBaseline){importBaseline.successors.forEach(s=>{if(s.personId===oldId)s.personId=newId});importBaseline.roles.forEach(r=>{if(r.incumbentPersonId===oldId)r.incumbentPersonId=newId})}
}
function typedFormErrors(pairs){
  const errs=[];
  pairs.forEach(([iid,f])=>{const err=typedValueError(f,v(iid));if(err)errs.push(err)});
  document.querySelectorAll('#drawerBody .extraField').forEach(i=>{const err=typedValueError(i.dataset.extraKey,i.value);if(err)errs.push(err)});
  return errs;
}
function savePerson(oldId=''){
  const id=v('pId').trim(),name=v('pName').trim();
  if(!id||!name){notice('ERR','Person ID and Name are required.');return}
  if(id!==oldId&&person(id)){notice('ERR',`Person ID "${id}" is already used by ${personName(id)}. Pick a unique ID.`);return}
  const typedErrs=typedFormErrors([['pReady','readiness'],['pSource','source'],['pType','candidateType'],['pPerf','performance'],['pPot','potential'],['pRet','retentionRisk'],['pMob','mobility'],['pConf','confidence'],['pDept','department'],['pLoc','location'],['pJob','jobLevel'],['pExp','criticalExperience'],['pSkills','skills']]);
  if(typedErrs.length){notice('ERR',typedErrs[0]);return}
  pushUndo(oldId?'Update employee/candidate':'Add employee/candidate');
  const val=x=>v(x)==='__ADD__'?'':v(x);
  const obj={id,name,title:v('pTitle'),department:val('pDept'),email:v('pEmail'),location:val('pLoc'),jobLevel:val('pJob'),readiness:val('pReady'),source:val('pSource'),candidateType:val('pType'),performance:val('pPerf'),potential:val('pPot'),retentionRisk:val('pRet'),mobility:val('pMob'),confidence:val('pConf'),criticalExperience:v('pExp'),skills:v('pSkills'),notes:v('pNotes'),_x:collectExtras(oldId?person(oldId)?._x:undefined)};
  const ix=oldId?people.findIndex(p=>p.id===oldId):-1;
  if(ix>=0){people[ix]=obj;if(oldId!==id)renamePersonRefs(oldId,id)}else people.push(obj);
  roles.forEach(r=>{if(r.incumbentPersonId===id)r.incumbentName=name});
  log('Candidate Saved',`${name} (${id}) saved`);
  notice('OK',`${name} saved.`);
  closeDrawer();render();
}
function deletePerson(id){
  if(locked('del')){lockNotice('del');return}
  if(!confirm('Delete this person and remove them from all slates?'))return;
  pushUndo('Delete candidate');
  const name=personName(id,id);
  people=people.filter(p=>p.id!==id);
  const affected=new Set(successors.filter(s=>s.personId===id).map(s=>s.roleId));
  successors=successors.filter(s=>s.personId!==id);
  affected.forEach(rid=>normalizeRanks(rid));
  roles.forEach(r=>{if(r.incumbentPersonId===id){r.incumbentPersonId='';r.incumbentName='VACANT'}});
  if(selectedPersonId===id)selectedPersonId='';
  currentDrawerPersonId='';
  log('Candidate Deleted',`${name} deleted`);
  notice('OK',`${name} deleted.`);
  closeDrawer();render();
}

function renameRoleRefs(oldId,newId){
  successors.forEach(s=>{if(s.roleId===oldId)s.roleId=newId});
  roles.forEach(r=>{if(r.managerRoleId===oldId)r.managerRoleId=newId});
  rules.forEach(r=>{
    if(r.targetRoleId&&String(r.targetRoleId).split('|').includes(oldId))r.targetRoleId=String(r.targetRoleId).split('|').map(x=>x===oldId?newId:x).join('|');
    if(r.type==='AUTO_BACKFILL'){const cfg=safeJSON(r.value,null);if(cfg&&Array.isArray(cfg.customMappings)){let hit=false;cfg.customMappings.forEach(m=>{if(m.roleId===oldId){m.roleId=newId;hit=true}});if(hit)r.value=JSON.stringify(cfg)}}
  });
  if(importBaseline){importBaseline.successors.forEach(s=>{if(s.roleId===oldId)s.roleId=newId});importBaseline.roles.forEach(r=>{if(r.id===oldId)r.id=newId;if(r.managerRoleId===oldId)r.managerRoleId=newId})}
}
function saveRole(oldId=''){
  const id=v('rId').trim(),title=v('rTitle').trim();

  if(id!==oldId&&role(id)){notice('ERR',`Role ID "${id}" is already used by ${role(id).title}. Pick a unique ID.`);return}
  if(v('rManager')==='__ADD__'){notice('ERR','Please add/select a manager role before saving.');return}
  const managerId=v('rManager');
  if(managerId&&oldId&&(managerId===oldId||isDescendant(managerId,oldId))){notice('ERR','That manager would create a circular reporting line.');return}
  if(managerId&&managerId===id){notice('ERR','A role cannot report to itself.');return}
  const typedErrs=typedFormErrors([['rLevel','level'],['rDept','department'],['rRisk','risk'],['rCrit','criticality'],['rStatus','status'],['rOwner','owner']]);
  if(typedErrs.length){notice('ERR',typedErrs[0]);return}
  pushUndo(oldId?'Update role':'Add role');
  const val=x=>v(x)==='__ADD__'?'':v(x);
  const inc=v('rInc');
  const obj={id,title,level:val('rLevel')||'VP',department:val('rDept'),boardId:val('rBoard'),managerRoleId:managerId,incumbentPersonId:inc,incumbentName:inc?personName(inc):'VACANT',risk:val('rRisk'),criticality:val('rCrit'),owner:v('rOwner'),status:v('rStatus'),sortOrder:Number(v('rSort')||999),_x:collectExtras(oldId?role(oldId)?._x:undefined)};
  const ix=oldId?roles.findIndex(r=>r.id===oldId):-1;
  if(ix>=0){roles[ix]=obj;if(oldId!==id)renameRoleRefs(oldId,id)}else roles.push(obj);
  log('Role Saved',`${title} (${id}) saved`);
  notice('OK',`${title} saved.`);
  closeDrawer();render();
}
function deleteRole(id){
  if(locked('del')){lockNotice('del');return}
  if(!confirm('Delete this role and all of its slate entries?'))return;
  pushUndo('Delete role');
  const title=role(id)?.title||id;
  roles=roles.filter(r=>r.id!==id);

  roles.forEach(r=>{if(r.managerRoleId===id)r.managerRoleId=''});

function ruleFieldChoices(){
  const extras=new Set([...extraKeysFor(people),...extraKeysFor(successors),...Object.keys(fieldTypes)].filter(k=>!BUILTIN_TYPABLE.includes(k)&&!CANDIDATE_FIELDS.includes(k)));
  return[...CANDIDATE_FIELDS,...[...extras].sort((a,b)=>a.localeCompare(b))];
}
function fieldOptions(selected=''){
  const choices=ruleFieldChoices();
  if(selected&&!choices.includes(selected))choices.unshift(selected);
  return choices.map(f=>`<option value="${attr(f)}" ${f===selected?'selected':''}>${esc(f)}</option>`).join('');
}
function selectedValues(value){return String(value||'').split('|').filter(Boolean)}
function checkboxId(){return 'cb-'+Math.random().toString(36).slice(2,9)}
function valueSelectForField(field,selected=''){
  let vals=valuesForField(field,[]);
  if(selected&&!vals.includes(selected))vals.unshift(selected);
  return `<select class="condValueSelect"><option value=""></option>${vals.map(x=>`<option value="${attr(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}<option value="__ADD__">+ Add value&hellip;</option></select>`;
}
function valueTextForField(field,selected=''){
  const listId='dl-'+checkboxId();
  return `<input class="condValueText" value="${attr(selectedValues(selected)[0]||selected||'')}" placeholder="Text to match&hellip;" list="${listId}"><datalist id="${listId}">${valuesForField(field,[]).map(x=>`<option value="${attr(x)}">`).join('')}</datalist>`;
}
function valueCheckboxesForField(field,selected=''){
  let vals=valuesForField(field,[]);const sel=selectedValues(selected);
  sel.forEach(x=>{if(!vals.includes(x))vals.unshift(x)});
  if(!vals.length)vals=[''];
  const allId=checkboxId();
  const boxes=vals.map(x=>{const bid=checkboxId();return `<label for="${bid}"><input id="${bid}" type="checkbox" class="condValCheck" value="${attr(x)}" ${sel.includes(x)?'checked':''}>${esc(x||'-- no values yet --')}</label>`}).join('');
  return `<div class="value-picker"><label class="select-all" for="${allId}"><input id="${allId}" type="checkbox" class="selAll" ${vals.length&&vals.every(x=>sel.includes(x))?'checked':''}>Select all</label>${boxes}<button type="button" class="btn btn-quiet btn-sm" data-action="addCheckboxValue" style="margin-top:6px">+ Add value</button></div>`;
}
function ruleFieldType(field){return fieldTypes[field]?fieldTypeOf(field):'text'}
function operatorChoicesFor(t){
  if(t==='number')return[['equals','equal to'],['not equals','not equal to'],['greater than','greater than'],['less than','less than'],['list','any of (list)']];
  if(t==='boolean')return[['equals','equal to'],['not equals','not equal to']];
  return[['equals','equal to'],['not equals','not equal to'],['contains','contains'],['not contains','does not contain'],['list','any of (list)']];
}
function operatorSelectHtml(field,selected){
  const choices=[...operatorChoicesFor(ruleFieldType(field))];
  if(selected&&!choices.some(([val])=>val===selected))choices.unshift([selected,selected]); // legacy rules keep their operator visible
  return `<select class="condOperator">${choices.map(([val,label])=>`<option value="${attr(val)}" ${val===selected?'selected':''}>${esc(label)}</option>`).join('')}</select>`;
}
function valueControlForCondition(field,op,selected=''){
  const t=ruleFieldType(field);
  if(op==='list')return valueCheckboxesForField(field,selected);
  if(t==='boolean')return `<select class="condValueSelect"><option value=""></option><option ${norm(selected)==='true'?'selected':''}>true</option><option ${norm(selected)==='false'?'selected':''}>false</option></select>`;
  if(t==='number')return `<input type="number" step="any" class="condValueText" value="${attr(selectedValues(selected)[0]||selected||'')}" placeholder="Number&hellip;">`;
  if(TEXT_OPERATORS.includes(op))return valueTextForField(field,selected);
  return valueSelectForField(field,selectedValues(selected)[0]||selected);
}
/* changing the field resets operator + value; changing the operator clears the value —

function updateConditionValue(elm){
  const row=elm.closest('.condition-row');
  const field=row.querySelector('.condField').value,op=row.querySelector('.condOperator').value;

  row.querySelector('.condValueBox').innerHTML=valueControlForCondition(field,op,current);

  const op=row.querySelector('.condOperator')?.value||'equals';
  if(op==='list')return[...row.querySelectorAll('.condValCheck')].filter(x=>x.checked).map(x=>x.value).join('|');

  if(txt)return txt.value;

function handleRuleValueSelect(sel){
  if(sel.value!=='__ADD__'){sel.dataset.previous=sel.value;return}
  const row=sel.closest('.condition-row'),field=row.querySelector('.condField').value;
  const prev=sel.dataset.previous||sel.options[0]?.value||'';
  openSmallValueBox('Add rule value',value=>{
    const terr=typedValueError(field,value);
    if(terr){notice('ERR',terr);return}
    addCustomValue(field,value);markDirty();
    const opt=document.createElement('option');opt.value=value;opt.textContent=value;
    sel.insertBefore(opt,sel.querySelector('option[value="__ADD__"]'));
    sel.value=value;sel.dataset.previous=value;
  });
  sel.value=prev;

    id?`<button class="btn btn-danger" data-action="deleteRule" data-rule-id="${attr(id)}">Delete Rule</button>`:'');
  updateRuleTypeUI();
}
function saveRule(oldId=''){
  if(locked('rules')){lockNotice('rules');return}
  const type=v('ruleType');
  const r={id:v('ruleId').trim()||uid('RULE'),name:v('ruleName'),type,scope:'Candidate',field:'',operator:'',value:'',personId:v('rulePerson'),targetRoleId:'',altPersonId:'',severity:v('ruleSeverity')||'Block',message:v('ruleMsg'),enabled:v('ruleEnabled')==='true'};
  if(r.id!==oldId&&rules.some(x=>x.id===r.id)){notice('ERR',`Rule ID "${r.id}" already exists.`);return}
  const missing=[];
  if(!r.name)r.name=type==='FIELD_RULE'?'Candidate Eligibility Rule':type==='BLOCK'?'Person Movement Block Rule':'Auto Backfill Rule';
  if(!r.message)r.message=type==='FIELD_RULE'?`Candidate does not meet the eligibility requirements (${r.name}).`:`${r.name} triggered.`;
  if(type==='BLOCK'){
    r.severity='Block';
    r.operator=v('ruleBlockOperator')||'cannot move to target role';
    r.targetRoleId=checkedValues('blockTargetCheck').join('|');
    if(!r.personId)missing.push('Person');
    if(r.operator==='cannot move to target role'&&!r.targetRoleId)missing.push('At least one target role');
    if(r.operator==='cannot change role')r.targetRoleId='';
  }
  if(type==='FIELD_RULE'){
    const conds=[...document.querySelectorAll('#conditionRows .condition-row')].map(row=>({field:row.querySelector('.condField')?.value||'',operator:row.querySelector('.condOperator')?.value||'',value:getConditionValues(row)})).filter(c=>c.field&&c.operator&&c.value);
    if(!conds.length)missing.push('At least one requirement with a value');
    r.field=conds[0]?.field||'';r.operator=conds[0]?.operator||'';r.value=JSON.stringify(conds);
    r.personId='';
    if(v('fieldScopeMode')==='some'){
      r.targetRoleId=checkedValues('fieldScopeCheck').join('|');
      if(!r.targetRoleId)missing.push('At least one role to apply to (or switch back to All roles)');
    }else r.targetRoleId='';
  }
  if(type==='AUTO_BACKFILL'){
    const autoType=v('autoTypeSelect');
    const autoTypes=autoType&&autoType!=='Custom'?[autoType]:[];
    const customMappings=[...document.querySelectorAll('#customMapRows .custom-map-row')].map(row=>({roleId:row.querySelector('.customRole')?.value||'',personId:row.querySelector('.customPerson')?.value||''})).filter(m=>m.roleId&&m.personId);
    if(!autoType)missing.push('Candidate type');
    if(autoType==='Custom'&&!customMappings.length)missing.push('At least one custom mapping row');
    r.value=JSON.stringify({mode:autoType==='Custom'?'custom':'type',autoTypes,customMappings});
    r.field='candidateType';r.operator='in list';r.personId='';r.targetRoleId='';
  }
  if(missing.length){notice('ERR','Missing required fields: '+missing.join(', '));return}
  pushUndo(oldId?'Update rule':'Add rule');
  const ix=rules.findIndex(x=>x.id===oldId||x.id===r.id);
  if(ix>=0)rules[ix]=r;else rules.push(r);
  log('Rule Saved',`${r.name} saved`);
  notice('OK',`Rule saved: ${r.name}`);
  activeTab='RULES';closeDrawer();render();
}
function deleteRule(id){
  if(locked('rules')){lockNotice('rules');return}
  if(!confirm('Delete this rule?'))return;
  pushUndo('Delete rule');
  const name=rules.find(r=>r.id===id)?.name||id;
  rules=rules.filter(r=>r.id!==id);
  log('Rule Deleted',name);
  notice('OK',`Rule deleted: ${name}`);
  closeDrawer();render();
}
function toggleRule(id,on){
  if(locked('rules')){lockNotice('rules');render();return}
  const r=rules.find(x=>x.id===id);if(!r)return;
  pushUndo(on?'Enable rule':'Disable rule');
  r.enabled=!!on;
  log(on?'Rule Enabled':'Rule Disabled',r.name||r.id);
  render();
}

function chessFieldOptions(){
  const base=[['title','Title'],['department','Department'],['location','Location'],['jobLevel','Job Level'],['readiness','Readiness'],['source','Source'],['candidateType','Candidate Type'],['confidence','Confidence'],['performance','Performance'],['potential','Potential'],['retentionRisk','Retention Risk'],['mobility','Mobility'],['skills','Skills'],['email','Email'],['criticalExperience','Critical Experience']];
  extraKeysFor(people).forEach(k=>base.push([k,k]));
  return base;
}
function chessFieldLabel(f){const hit=chessFieldOptions().find(([k])=>k===f);return hit?hit[1]:f}
function chessActiveFields(){return chessSessionFields||chessDefaultFields||CHESS_DEFAULT_FIELDS}
function chessPieceFor(i){const r=pieceSet().ranks;return r[Math.min(i,r.length-1)]}
function ordinal(n){return n+(n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th')}
function displayFieldValue(s,f){
  const p=person(s.personId)||{};
  const sv=['readiness','source','candidateType','confidence'].includes(f)?s[f]:undefined;
  return sv||p[f]||(p._x||{})[f]||'';
}
function openChessView(roleId){
  const r=role(roleId);
  if(!r){notice('ERR','Role not found.');return}
  closeDrawer();

}
/* staged additions from the bank live in the order list as "NEW::<personId>" until Save */
function chessRow(entryId){
  if(!chess||!entryId)return null;
  if(String(entryId).startsWith('NEW::')){
    const pid=String(entryId).slice(5);
    const p=person(pid);
    if(!p)return null;
    return{id:entryId,roleId:chess.roleId,personId:pid,readiness:p.readiness||'1-2 Years',source:p.source||'Internal',candidateType:p.candidateType||'Successor',confidence:p.confidence||'Medium',ranking:chess.order.indexOf(entryId)+1,notes:'',approved:false,autoMoveQueued:false,_isNew:true};
  }

}
function chessBankPeople(){
  const r=role(chess.roleId);
  const onBoard=new Set(chess.order.map(id=>chessRow(id)?.personId).filter(Boolean));
  const q=norm(chess.bankQuery||'');
  return people.filter(p=>!onBoard.has(p.id)&&p.id!==r.incumbentPersonId&&[p.id,p.name,p.title,p.department,p.location].join(' ').toLowerCase().includes(q)).slice(0,80);

function chessBankListHtml(){
  return chessBankPeople().map(p=>`<div class="bank-piece" draggable="true" data-drag="chessBank" data-person-id="${attr(p.id)}" title="Drag onto the board to add — onto a piece to take its spot, or onto the throne"><span class="bp-glyph">${piecePawn()}</span><span class="bp-main"><b>${esc(p.name)}</b><span>${esc(p.title||p.department||p.id)}</span></span></div>`).join('')||'<div class="hint">No one matches.</div>';
}
function chessAddFromBank(pid,beforeEntryId){
  if(!chess||!person(pid))return;
  const onBoard=chess.order.some(id=>chessRow(id)?.personId===pid);
  if(onBoard||successors.some(s=>s.roleId===chess.roleId&&s.personId===pid)){notice('WARN',`${personName(pid)} is already on this slate.`);return}

function closeChessView(force=false){

function chessSwap(aSid,bSid){
  if(!chess)return;
  const i=chess.order.indexOf(aSid),j=chess.order.indexOf(bSid);
  if(i<0||j<0||i===j)return;
  [chess.order[i],chess.order[j]]=[chess.order[j],chess.order[i]];
  chess.dirtyMoves=true;
  renderChessView();
}
function chessTakeSeat(sid){
  if(locked('moves')){lockNotice('moves');return}
  if(!chess||!chess.order.includes(sid))return;
  chess.stagedIncumbent=sid;
  renderChessView();
}
function chessResetSeat(){if(chess){chess.stagedIncumbent=null;renderChessView()}}
function chessRoleGroups(){
  const lvls=levels();const li=l=>{const i=lvls.indexOf(l);return i<0?99:i};
  const bySort=(a,b)=>li(a.level)-li(b.level)||(+a.sortOrder||999)-(+b.sortOrder||999);
  const groups=[];const used=new Set();
  boards.filter(b=>!SYSTEM_BOARDS.includes(b.id)).forEach(b=>{
    const rs=roles.filter(r=>!used.has(r.id)&&(r.boardId===b.id||b.name===r.department)).sort(bySort);
    rs.forEach(r=>used.add(r.id));
    if(rs.length)groups.push({name:b.name,roles:rs});
  });
  const rest=roles.filter(r=>!used.has(r.id)).sort(bySort);
  if(rest.length)groups.push({name:'Other roles',roles:rest});
  return groups;
}
function chessGoTo(rid){
  if(!chess||!role(rid))return;
  if(rid===chess.roleId)return;
  if((chess.dirtyMoves||chess.stagedIncumbent)&&!confirm('Discard the unsaved moves on this board?')){renderChessView();return}
  const fields=[...chess.fields];
  chess={roleId:rid,order:slateFor(rid).map(s=>s.id),stagedIncumbent:null,dirtyMoves:false,menuOpen:false,fields,bankQuery:''};
  renderChessView();
}
function chessNav(delta){

function chessCallouts(r){
  const out=[];
  if(chess.stagedIncumbent){
    const s=chessRow(chess.stagedIncumbent);
    if(s){
      const e=evaluateRules(s);
      e.blocks.forEach(m=>out.push(['err','Blocked by rule: '+m]));
      e.reviews.forEach(m=>out.push(['warn',m]));
      const old=currentRoleForPerson(s.personId);
      if(old&&old.id!==r.id)out.push(['warn',`${personName(s.personId)} currently holds ${old.title} — saving leaves it VACANT (backfill rules and the auto-move queue will run).`]);
      if(r.incumbentPersonId&&r.incumbentPersonId!==s.personId)out.push(['warn',`${personName(r.incumbentPersonId,r.incumbentName)} steps down from ${r.title} on save.`]);
    }
  }
  return out;
}

  slateFor(chess.roleId).forEach(s=>{if(!chess.order.includes(s.id))chess.order.push(s.id)});
  if(chess.stagedIncumbent&&!chess.order.includes(chess.stagedIncumbent))chess.stagedIncumbent=null;

    :(isRoleVacant(r)
      ?`<div class="throne vacant" data-drop="chessKing"><div class="t-label">Empty throne</div><span class="king">${pieceKing()}</span><div class="t-name" style="color:var(--red)">VACANT</div><div class="t-sub">Drag a piece here to take the seat</div></div>`
      :`<div class="throne" data-drop="chessKing"><div class="t-label">King — current incumbent</div><span class="king">${pieceKing()}</span><div class="t-name">${esc(personName(r.incumbentPersonId,r.incumbentName))}</div><div class="t-sub">Drag a piece onto the throne to replace</div></div>`);
  const stepsDown=staged&&r.incumbentPersonId&&r.incumbentPersonId!==staged.personId
    ?`<div class="steps-down"><b>${esc(personName(r.incumbentPersonId,r.incumbentName))}</b> steps down when you save.</div>`:'';
  const fieldsMenu=chess.menuOpen?`<div class="chess-fields-menu">
      <div class="cf-head">Info shown under every piece</div>
      ${chessFieldOptions().map(([f,label])=>`<label><input type="checkbox" data-change="chessField" data-field="${attr(f)}" ${fields.includes(f)?'checked':''}>${esc(label)}</label>`).join('')}
      <div style="border-top:1px solid var(--line2);margin-top:8px;padding-top:8px">
        <button class="btn btn-quiet btn-sm" data-action="chessSetDefault" style="width:100%">Make default for all boards</button>
        <div class="hint" style="margin-top:6px">Applies to every role&rsquo;s chess view across the whole program and is saved in the CSV.</div>
      </div>

  el('chessOverlay').innerHTML=`

        <div class="chess-bank">
          <div class="side-title">Piece Bank</div>
          <div class="hint">Everyone not on this slate. Drag onto a piece to take its spot, onto the open board to join last, or onto the throne.</div>
          <input id="chessBankSearch" data-input="chessBank" placeholder="Search people&hellip;" value="${attr(chess.bankQuery||'')}" style="margin-top:8px">

      <button class="btn btn-quiet btn-sm" data-action="chessNav" data-delta="1" title="Next role">Next &#8594;</button>
    </div>`;
  el('chessOverlay').className='chess-overlay board-'+(appearance.board||'classic');
}
function saveChessView(){
  if(!chess)return;
  const r=role(chess.roleId);
  if(!r){closeChessView(true);return}
  const stagedProbe=chess.stagedIncumbent?chessRow(chess.stagedIncumbent):null;
  if(chess.stagedIncumbent&&!stagedProbe){notice('ERR','Cannot save: the staged candidate&rsquo;s record is missing.');renderChessView();return}
  if(stagedProbe){
    const e=evaluateRules(stagedProbe);
    if(e.blocks.length){e.blocks.forEach(m=>notice('ERR',m));renderChessView();return}
    if(!person(stagedProbe.personId)){notice('ERR','Cannot save: the candidate&rsquo;s person record is missing.');renderChessView();return}
  }
  const newEntries=chess.order.filter(id=>String(id).startsWith('NEW::'));
  if(!chess.dirtyMoves&&!stagedProbe&&!newEntries.length){closeChessView(true);return}
  pushUndo('Chess board save');
  automationDepth=0;
  // staged bank additions become real slate rows now
  const idMap=new Map();
  newEntries.forEach(entry=>{
    const pid=String(entry).slice(5),p=person(pid);
    if(!p||successors.some(s=>s.roleId===chess.roleId&&s.personId===pid)){idMap.set(entry,null);return}
    const row={id:uid('S'),roleId:chess.roleId,personId:pid,readiness:p.readiness||'1-2 Years',source:p.source||'Internal',candidateType:p.candidateType||'Successor',confidence:p.confidence||'Medium',ranking:999,notes:'',approved:false,autoMoveQueued:false};
    successors.push(row);
    idMap.set(entry,row.id);
    log('Candidate Added',`${p.name} added to ${r.title} on the chess board`);
  });
  chess.order=chess.order.map(id=>idMap.has(id)?idMap.get(id):id).filter(Boolean);
  if(chess.stagedIncumbent&&idMap.has(chess.stagedIncumbent))chess.stagedIncumbent=idMap.get(chess.stagedIncumbent);
  const staged=chess.stagedIncumbent?successors.find(s=>s.id===chess.stagedIncumbent):null;
  const rankOf=new Map(chess.order.map((id,i)=>[id,i+1]));
  successors.filter(s=>s.roleId===chess.roleId&&rankOf.has(s.id)).forEach(s=>s.ranking=rankOf.get(s.id));
  normalizeRanks(chess.roleId);
  if(staged){
    const p=person(staged.personId);
    evaluateRules(staged).reviews.forEach(m=>notice('WARN',m));
    const old=currentRoleForPerson(staged.personId);
    successors.filter(x=>x.roleId===staged.roleId).forEach(x=>x.approved=false);
    staged.approved=true;
    const affected=new Set(successors.filter(x=>x.personId===staged.personId&&x.id!==staged.id).map(x=>x.roleId));
    successors=successors.filter(x=>x.id===staged.id||x.personId!==staged.personId);
    affected.forEach(rid=>normalizeRanks(rid));
    const replaced=r.incumbentPersonId?personName(r.incumbentPersonId,r.incumbentName):'VACANT';
    r.incumbentPersonId=staged.personId;r.incumbentName=p.name;r.status='Approved Move';
    if(old&&old.id!==r.id){old.incumbentPersonId='';old.incumbentName='VACANT';old.status='Action Required';old.risk='High';runVacancyAutomation(old.id)}
    log('Approved Move',`${p.name} moved to ${r.title} on the chess board; replaced ${replaced}`);
    notice('OK',`${p.name} approved into ${r.title}.`);
  }else{
    log('Slate Reordered',`${r.title} slate reordered on the chess board`);
    notice('OK','New slate order saved.');
  }
  closeChessView(true);
  render();
}

document.addEventListener('drop',async e=>{
  e.preventDefault();
  document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));
  if(e.dataTransfer.files&&e.dataTransfer.files.length){
    // grab file-system handles synchronously — DataTransfer items are gone after the first await
    const handlePromise=[...(e.dataTransfer.items||[])].map(it=>it.getAsFileSystemHandle?it.getAsFileSystemHandle().catch(()=>null):Promise.resolve(null));
    const allFiles=[...e.dataTransfer.files].filter(f=>/\.(csv|xlsx)$/i.test(f.name));
    if(!allFiles.length){notice('WARN','Only .csv and .xlsx files can be dropped here.');return}
    // a single full-database CSV dropped alone = open it (replace + connect);
    // everything else (simple sheets, Excel workbooks, multiple files) = merge with review
    if(allFiles.length===1&&/\.csv$/i.test(allFiles[0].name)){
      const text=await allFiles[0].text();
      if((parseCSV(text)[0]||[]).map(h=>String(h).trim()).includes('recordType')){
        if(dirty&&!confirm('Opening this file will replace the unsaved changes on screen. Continue?'))return;
        if(loadCSV(text)){
          el('dbStatus').textContent=allFiles[0].name;
          fileHandle=null;
          try{const h=await handlePromise[0];if(h&&h.kind==='file'){fileHandle=h;rememberFileHandle(h)}}catch(err){}
          if(!fileHandle)el('dbStatus').textContent=allFiles[0].name+' (dropped — use Save/Export to write changes)';
          bannerState.fileName='';bannerState.backup=null;renderBanners();
        }
        return;
      }
    }
    importFilesFlow(allFiles);
    return;
  }
  const t=e.target.closest('[data-drop]');
  if(!t)return;
  const succId=e.dataTransfer.getData('succId'),personId=e.dataTransfer.getData('personId'),chessSucc=e.dataTransfer.getData('chessSucc');
  if(chessSucc){
    if(t.dataset.drop==='chessPiece')return chessSwap(chessSucc,t.dataset.succId);
    if(t.dataset.drop==='chessKing')return chessTakeSeat(chessSucc);
    return;
  }
  const bankPid=e.dataTransfer.getData('chessBank');
  if(bankPid){
    if(t.dataset.drop==='chessPiece')return chessAddFromBank(bankPid,t.dataset.succId);
    if(t.dataset.drop==='chessGrid')return chessAddFromBank(bankPid,null);
    if(t.dataset.drop==='chessKing'){
      chessAddFromBank(bankPid,null);
      const entry='NEW::'+bankPid;
      if(chess&&chess.order.includes(entry))chessTakeSeat(entry);
    }
    return;
  }
  if(t.dataset.drop==='succ'){
    const target=successors.find(x=>x.id===t.dataset.succId);
    if(!target)return;
    if(succId)return reorderSuccessorBefore(succId,target.id);
    if(personId)return addSuccessorBefore(personId,target.roleId,target.id);
  }else if(t.dataset.drop==='role'){
    if(succId)return moveSuccessorToRole(succId,t.dataset.roleId);
    if(personId)return addSuccessor(personId,t.dataset.roleId);
  }
});

<script>
'use strict';
/* =====================================================================
   Sheet import (merge) — lets HR keep an Excel workbook with People /
   Roles / Candidates tabs, export each tab as CSV, and merge them into
   the master database with a review step and downloadable error report.
   ===================================================================== */
let lastImportReport=null;

function normalizeHeader(h){return String(h||'').toLowerCase().replace(/[_-]+/g,' ').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function detectSheetType(nh){
  const has=x=>nh.includes(x);
  if(has('recordtype')||has('record type'))return 'FULL';
  if((has('board id')||has('boardid'))&&(has('board name')||has('boardname')))return 'BOARDS';
  if(has('role title')||has('roletitle'))return 'ROLES';
  if(has('person name')||has('personname')||has('full name'))return 'PEOPLE';
  const roleRef=['role','role id','roleid','successor role id','successorroleid'].some(has);
  const personRef=['person','person id','personid','candidate'].some(has);
  if(roleRef&&personRef)return 'SLATE';
  if((has('person id')||has('personid'))&&has('name'))return 'PEOPLE';
  if(has('name')&&(has('readiness')||has('candidate type')||has('email')))return 'PEOPLE';
  if(has('title')&&has('level'))return 'ROLES';
  return null;
}
const SHEET_ALIASES={
  PEOPLE:{'person id':'personId','personid':'personId','id':'personId','employee id':'personId','name':'personName','person name':'personName','personname':'personName','full name':'personName','title':'personTitle','person title':'personTitle','persontitle':'personTitle','current title':'personTitle','department':'personDepartment','dept':'personDepartment','person department':'personDepartment','persondepartment':'personDepartment','email':'personEmail','personemail':'personEmail','email employee id':'personEmail','location':'location','job level':'jobLevel','joblevel':'jobLevel','performance':'performance','potential':'potential','retention risk':'retentionRisk','retentionrisk':'retentionRisk','mobility':'mobility','critical experience':'criticalExperience','criticalexperience':'criticalExperience','skills':'skills','readiness':'readiness','source':'source','candidate type':'candidateType','candidatetype':'candidateType','type':'candidateType','confidence':'confidence','notes':'notes'},
  ROLES:{'role id':'roleId','roleid':'roleId','id':'roleId','role title':'roleTitle','roletitle':'roleTitle','title':'roleTitle','role':'roleTitle','level':'level','department':'department','dept':'department','manager role':'managerRoleId','manager role id':'managerRoleId','managerroleid':'managerRoleId','manager':'managerRoleId','reports to':'managerRoleId','incumbent':'incumbentRef','incumbent person id':'incumbentRef','incumbentpersonid':'incumbentRef','current person':'incumbentRef','incumbent name':'incumbentRef','incumbentname':'incumbentRef','board':'boardRef','board id':'boardRef','boardid':'boardRef','tab':'boardRef','risk':'risk','criticality':'criticality','owner':'owner','status':'status','sort order':'sortOrder','sortorder':'sortOrder'},
  SLATE:{'role':'roleRef','role id':'roleRef','roleid':'roleRef','role title':'roleRef','successor role id':'roleRef','successorroleid':'roleRef','person':'personRef','person id':'personRef','personid':'personRef','candidate':'personRef','ranking':'ranking','rank':'ranking','priority':'ranking','readiness':'readiness','source':'source','candidate type':'candidateType','candidatetype':'candidateType','type':'candidateType','confidence':'confidence','notes':'notes','approved':'approved','auto move queued':'autoMoveQueued','automovequeued':'autoMoveQueued'},
  BOARDS:{'board id':'boardId','boardid':'boardId','board name':'boardName','boardname':'boardName'},
};
const PERSON_KEYMAP={personName:'name',personTitle:'title',personDepartment:'department',personEmail:'email',location:'location',jobLevel:'jobLevel',performance:'performance',potential:'potential',retentionRisk:'retentionRisk',mobility:'mobility',criticalExperience:'criticalExperience',skills:'skills',readiness:'readiness',source:'source',candidateType:'candidateType',confidence:'confidence',notes:'notes'};
function buildSheetImport(fileTexts,dbExtras,base){
  const src=base||{people,roles,successors,boards,rules,history,customFieldValues};
  const staged={people:deepClone(src.people||[]),roles:deepClone(src.roles||[]),successors:deepClone(src.successors||[]),boards:deepClone(src.boards||systemBoards()),rules:deepClone(src.rules||[]),history:deepClone(src.history||[]),customFieldValues:deepClone(src.customFieldValues||{})};

function openImportReview(review){
  importReview=review;lastImportReport=review.report;
  const s=review.stats;
  const sevBadge=s=>s==='ERROR'?'<span class="badge red">Error</span>':s==='WARNING'?'<span class="badge amber">Warning</span>':'<span class="badge gray">Info</span>';
  const issueRows=review.report.slice(0,200).map(i=>`<tr><td>${sevBadge(i.severity)}</td><td style="white-space:nowrap">${esc(i.file)} · row ${i.row}</td><td>${esc(i.sheet)}</td><td>${esc(i.id)}</td><td>${esc(i.problem)}</td><td>${esc(i.action)}</td></tr>`).join('');
  const isConvert=review.mode==='convert';
  openDrawer(isConvert?'Convert to Planner CSV':'Import Review',
    (isConvert?'Converting: ':'Sheets: ')+review.files.join(', ')+(isConvert?' — your open database is not touched; the result downloads as a CSV file.':' — nothing is saved until you press Apply Import.'),
    `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
      <div class="kpi"><b>${s.peopleAdded+s.peopleUpdated}</b><small>People</small><div class="sub">${s.peopleAdded} new · ${s.peopleUpdated} updated</div></div>
      <div class="kpi"><b>${s.rolesAdded+s.rolesUpdated}</b><small>Roles</small><div class="sub">${s.rolesAdded} new · ${s.rolesUpdated} updated</div></div>
      <div class="kpi"><b>${s.slateAdded+s.slateUpdated}</b><small>Slate rows</small><div class="sub">${s.slateAdded} new · ${s.slateUpdated} updated</div></div>
      <div class="kpi"><b style="${s.errors?'color:var(--red)':''}">${s.errors}</b><small>Errors</small><div class="sub">rows skipped</div></div>
      <div class="kpi"><b style="${s.warnings?'color:var(--amber)':''}">${s.warnings}</b><small>Warnings</small><div class="sub">imported, check them</div></div>
      ${s.other?`<div class="kpi"><b>${s.other}</b><small>Other updates</small><div class="sub">rules, tabs, history, settings</div></div>`:''}
    </div>`+
    ((!isConvert&&review.changes&&review.changes.length)?(()=>{
      const entName={person:'Person',role:'Role',slate:'Slate',board:'Board'};
      const rows=review.changes.slice(0,300).map(c=>{
        let desc;
        if(c.t==='add')desc=c.entity==='slate'?'Added to the slate':'New '+(entName[c.entity]||c.entity).toLowerCase()+' added';
        else{
          const frm=String(c.from??'')===''?'—':String(c.field==='incumbentPersonId'?(c.fromName||c.from):c.from);
          desc=`${esc(c.field==='incumbentPersonId'?'incumbent':c.field)}: <span class="hint">“${esc(frm)}”</span> &rarr; `;
          desc+=(c.bool||typeof c.to==='boolean'||c.field==='incumbentPersonId')
            ?`<b>${esc(String(c.field==='incumbentPersonId'?(c.toName||c.to||'VACANT'):c.to))}</b>`
            :`<input class="impEdit" data-cid="${c.cid}" value="${attr(String(c.to??''))}" style="max-width:150px;padding:4px 8px">`;
        }
        return `<tr><td><input type="checkbox" class="impChange" data-cid="${c.cid}" checked></td><td>${entName[c.entity]||c.entity}</td><td><b>${esc(c.label)}</b></td><td>${desc}</td></tr>`;
      }).join('');
      return `<div class="rule-section"><h3>Changes (${review.changes.length})</h3><div class="hint" style="margin-bottom:8px">Incoming values win and nothing is ever deleted. <b>Uncheck</b> a row to skip that change, or <b>edit the incoming value</b> right here before applying.</div><div class="tablebox"><table class="table"><thead><tr><th>Apply</th><th>Type</th><th>Record</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table>${review.changes.length>300?`<div class="tfoot-note">Showing 300 of ${review.changes.length} — the rest apply as-is.</div>`:''}</div></div>`;
    })():'')+
    (review.report.length
      ?`<div class="tablebox"><table class="table"><thead><tr><th></th><th>Where</th><th>Sheet</th><th>Record</th><th>Problem</th><th>What was done</th></tr></thead><tbody>${issueRows}</tbody></table>${review.report.length>200?`<div class="tfoot-note">Showing 200 of ${review.report.length} — the downloadable report has everything.</div>`:''}</div>`
      :'<div class="notice ok">No issues found — every row lines up cleanly.</div>'),
    ()=>applyImport(),
    `<button class="btn btn-danger" data-action="importCancel">Cancel</button> ${review.report.length?'<button class="btn btn-quiet" data-action="downloadImportReport">Download error report</button>':''}`);
  el('drawerSave').textContent=isConvert?'Download converted CSV':'Apply Import';
}

    notice('OK','Converted CSV downloaded — open it with Open CSV whenever you want.');
    importReview=null;
    closeDrawer();
    return;
  }
  let skippedChanges=0;
  if(importReview.changes&&importReview.changes.length){
    const unchecked=new Set([...document.querySelectorAll('.impChange')].filter(c=>!c.checked).map(c=>c.dataset.cid));
    const edits=new Map();
    document.querySelectorAll('.impEdit').forEach(i=>edits.set(i.dataset.cid,i.value));
    for(const c of importReview.changes){
      if(c.t!=='set'||unchecked.has(c.cid)||!edits.has(c.cid))continue;
      const nv=edits.get(c.cid);
      if(String(nv)===String(c.to??''))continue;
      const terr=typedValueError(c.field,nv);
      if(terr){notice('ERR','Fix an edited value first — '+terr);return}
      if((c.field==='ranking'||c.field==='sortOrder')&&nv.trim()&&isNaN(+nv)){notice('ERR',`"${c.field}" must be a number — got "${nv}".`);return}
    }
    const st=importReview.staged;
    const pIdx=new Map(st.people.map(p=>[p.id,p]));
    const rIdx=new Map(st.roles.map(r=>[r.id,r]));

    st.successors.forEach(s=>{
      if(!realSlateIds.has(s.id)&&(removedP.has(s.personId)||removedR.has(s.roleId)))removedS.add(s.id);
    });
    importReview.changes.forEach(c=>{
      if(c.t!=='set')return;
      const rec=c.entity==='person'?pIdx.get(c.id):c.entity==='role'?rIdx.get(c.id):c.entity==='slate'?sIdx.get(c.id):null;
      if(!rec)return;
      const skip=unchecked.has(c.cid)
        ||(c.field==='incumbentPersonId'&&removedP.has(c.to))
        ||(c.field==='managerRoleId'&&removedR.has(c.to))
        ||(c.field==='boardId'&&removedB.has(c.to));

        else{rec[c.field]=c.from;if(c.field==='incumbentPersonId')rec.incumbentName=c.fromName||'VACANT'}

    if(removedB.size)st.boards=st.boards.filter(b=>!removedB.has(b.id));

async function importFilesFlow(files){

function buildScopedData(scope){

  if(ids.includes('ALL'))return{boards:deepClone(boards),people:deepClone(people),roles:deepClone(roles),successors:deepClone(successors),rules:deepClone(rules),history:[],customFieldValues:deepClone(customFieldValues),chessFields:chessDefaultFields||CHESS_DEFAULT_FIELDS};

function saveDataTools(){
  const changes={};
  document.querySelectorAll('#drawerBody .ftType').forEach(sel=>{changes[sel.dataset.field]={type:sel.value,on:sel.dataset.builtin?'builtin':'all'}});
  document.querySelectorAll('#drawerBody .ftOn').forEach(sel=>{if(changes[sel.dataset.field])changes[sel.dataset.field].on=sel.value});
  const skipped=[];const added=[];
  v('bulkFields').split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const parts=line.split(',').map(x=>x.trim());
    const name=(parts[0]||'').replace(/["\r\n]/g,'').trim();
    let type=(parts[1]||'text').toLowerCase(),on=(parts[2]||'all').toLowerCase();
    if(!name)return;
    if(CSV_HEADERS.includes(name)||BUILTIN_TYPABLE.includes(name)){skipped.push(`"${name}" is a built-in field — set its type in the table above`);return}
    if(changes[name]){skipped.push(`"${name}" already exists`);return}
    if(!FIELD_TYPES.includes(type))type='text';
    if(!['all','person','role','candidate'].includes(on))on='all';
    changes[name]={type,on};added.push(name);
  });
  for(const[name,def]of Object.entries(changes)){
    const a=allowedTypesFor(name);
    if((def.type==='number'&&!a.number)||(def.type==='boolean'&&!a.boolean)){notice('ERR',`"${name}" can’t be ${def.type} — existing values don’t fit. Fix the data first.`);return}
  }
  // built-ins default to text — only keep entries that actually re-type them
  Object.entries(changes).forEach(([k,def])=>{if(def.on==='builtin'&&def.type==='text')delete changes[k]});
  pushUndo('Update custom fields');
  fieldTypes=changes;
  log('Fields Updated',`${Object.keys(changes).length} custom field definition(s) saved${added.length?'; added: '+added.join(', '):''}`);
  notice(skipped.length?'WARN':'OK',(added.length?plur(added.length,'field')+' added. ':'')+'Field settings saved.'+(skipped.length?' Skipped: '+skipped.join('; '):''));
  closeDrawer();render();
}

function widgetNumericChoices(source){

function computeWidget(w){
  const all=widgetRecords(w.source);
  const list=all.filter(rec=>{
    if(!w.filter||!w.filter.field)return true;
    return compare(recVal(w.source,rec,w.filter.field),w.filter.operator||'equals',w.filter.value);
  });
  if(w.kind==='count')return{big:list.length.toLocaleString()};
  if(w.kind==='percent')return{big:pct(list.length,all.length)+'%',sub:`${list.length} of ${all.length}`};
  if(w.kind==='sum'||w.kind==='avg'){
    const nums=list.map(r=>parseFloat(String(recVal(w.source,r,w.field)??'').replace(/,/g,''))).filter(n=>!isNaN(n));
    const sum=nums.reduce((a,b)=>a+b,0);
    const val=w.kind==='sum'?sum:(nums.length?sum/nums.length:0);
    return{big:(Math.round(val*100)/100).toLocaleString(),sub:`${w.kind==='sum'?'sum':'average'} of ${w.field} · ${nums.length} value${nums.length===1?'':'s'}`};
  }
  const groups={};
  list.forEach(r=>{const k=String(recVal(w.source,r,w.field)??'')||'(blank)';groups[k]=(groups[k]||0)+1});

    const slices=entries.slice(0,5);

    if(rest)slices.push(['Other',rest]);

  }

function donutSvg(slices,total,hole){
  const C=60,R=52;
  if(!total)return `<svg viewBox="0 0 120 120" width="132" height="132" role="img"><circle cx="${C}" cy="${C}" r="${R}" fill="var(--line2)"/></svg>`;
  let a0=-Math.PI/2;
  const paths=slices.map(([k,n],i)=>{
    const frac=n/total,color=CHART_COLORS[i%CHART_COLORS.length];
    if(frac>=0.999){a0+=frac*2*Math.PI;return `<circle cx="${C}" cy="${C}" r="${R}" fill="${color}" stroke="#fff" stroke-width="2"/>`}
    const a1=a0+frac*2*Math.PI;
    const large=(a1-a0)>Math.PI?1:0;
    const x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);
    const d=`M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L ${C} ${C} Z`;
    a0=a1;
    return `<path d="${d}" fill="${color}" stroke="#fff" stroke-width="2"></path>`;
  }).join('');
  const center=hole?`<circle cx="${C}" cy="${C}" r="30" fill="var(--surface)"></circle><text x="${C}" y="${C+6}" text-anchor="middle" style="font-size:17px;font-weight:700;fill:var(--ink)">${total}</text>`:'';

}

    if(c.bars)body=c.bars.map(([k,n])=>`<div class="barrow"><span class="lbl" title="${attr(k)}">${esc(k)}</span><span class="track"><span class="fill" style="width:${pct(n,c.max)}%"></span></span><span class="val">${n}</span></div>`).join('')||'<div class="hint">No data.</div>';
    else if(c.slices){
      const legend=c.slices.map(([k,n],i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:12px;margin:3px 0"><span style="width:10px;height:10px;border-radius:3px;background:${CHART_COLORS[i%CHART_COLORS.length]};flex:none"></span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${attr(k)}">${esc(k)}</span><span style="margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums">${n} · ${pct(n,c.total)}%</span></div>`).join('');
      body=`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div>${donutSvg(c.slices,c.total,w.kind==='donut')}</div><div style="flex:1;min-width:140px">${legend||'<div class="hint">No data.</div>'}</div></div>`;
    }
    else body=`<b style="font-size:26px;line-height:1.2">${esc(c.big)}</b>${c.sub?`<div class="hint">${esc(c.sub)}</div>`:''}`;
    return `<div class="insight-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px"><h3 style="margin:0">${esc(w.title)}</h3><button class="icon-btn bad" data-action="removeWidget" data-widget-id="${attr(w.id)}" title="Remove this widget">&#10005;</button></div>${body}<div class="hint" style="margin-top:8px">${esc(widgetDesc(w))}</div></div>`;
  }).join('');
  return `<div class="side-title" style="margin:2px 0 8px">My Dashboard</div><div class="insight-grid" style="margin-bottom:18px">${cards}</div>`;
}
function updateWidgetFilterControls(){
  const source=v('wSource'),f=v('wfField');
  const opBox=el('wfOpBox'),valBox=el('wfValueBox');
  if(!opBox||!valBox)return;
  if(!f){opBox.innerHTML='<select id="wfOp" disabled><option></option></select>';valBox.innerHTML='<input id="wfValue" disabled placeholder="— no filter —">';return}
  const t=widgetFieldType(source,f);
  const ops=operatorChoicesFor(t).filter(([val])=>val!=='list');
  opBox.innerHTML=`<select id="wfOp">${ops.map(([val,label])=>`<option value="${attr(val)}">${esc(label)}</option>`).join('')}</select>`;
  if(t==='boolean')valBox.innerHTML='<select id="wfValue"><option>true</option><option>false</option></select>';
  else if(t==='number')valBox.innerHTML='<input id="wfValue" type="number" step="any">';
  else{
    const vals=[...new Set(widgetRecords(source).map(r=>String(recVal(source,r,f)??'')).filter(Boolean))].sort().slice(0,30);
    valBox.innerHTML=`<input id="wfValue" list="wfdl"><datalist id="wfdl">${vals.map(x=>`<option value="${attr(x)}">`).join('')}</datalist>`;
  }
}
function openWidgetDrawer(preset={}){
  const p={title:preset.title||'',source:preset.source||'roles',kind:preset.kind||'count',field:preset.field||''};
  const needsField=['sum','avg','bar','pie','donut'].includes(p.kind);
  const fieldChoices=['bar','pie','donut'].includes(p.kind)?widgetFieldChoices(p.source):widgetNumericChoices(p.source);
  const filterChoices=[...new Map([...widgetFieldChoices(p.source),...widgetNumericChoices(p.source)]).entries()];
  openDrawer('Add Dashboard Widget',`Up to ${MAX_WIDGETS} widgets live on the Insights tab and are saved in the CSV. They always show all data.`,
    `<div class="grid">
      <div><label>Title</label><input id="wTitle" value="${attr(p.title)}" placeholder="Optional — named automatically"></div>
      <div><label>Data</label><select id="wSource">${[['roles','Roles'],['people','People'],['candidates','Slate rows (candidates)']].map(([val,label])=>`<option value="${val}" ${p.source===val?'selected':''}>${label}</option>`).join('')}</select></div>
      <div><label>Widget</label><select id="wKind">${[['count','Number — count'],['percent','Number — % of total'],['sum','Number — sum of a field'],['avg','Number — average of a field'],['bar','Bar chart — breakdown by field'],['pie','Pie chart — share by field'],['donut','Donut chart — share by field']].map(([val,label])=>`<option value="${val}" ${p.kind===val?'selected':''}>${label}</option>`).join('')}</select></div>
      <div class="${needsField?'':'hidden'}" id="wFieldBox"><label>${['bar','pie','donut'].includes(p.kind)?'Break down by':'Numeric field'}</label><select id="wField">${fieldChoices.map(([val,label])=>`<option value="${attr(val)}" ${p.field===val?'selected':''}>${esc(label)}</option>`).join('')||'<option value="">— add a Number field in Data Tools first —</option>'}</select></div>
    </div>
    <div class="rule-section"><h3>Filter (optional)</h3><div class="hint" style="margin-bottom:8px">Only include records that match. Operators follow the field&rsquo;s type — no &ldquo;greater than&rdquo; on text.</div>
      <div class="grid">
        <div><label>Field</label><select id="wfField"><option value="">— no filter —</option>${filterChoices.map(([val,label])=>`<option value="${attr(val)}">${esc(label)}</option>`).join('')}</select></div>
        <div><label>Operator</label><span id="wfOpBox"><select id="wfOp" disabled><option></option></select></span></div>
        <div><label>Value</label><span id="wfValueBox"><input id="wfValue" disabled placeholder="— no filter —"></span></div>
      </div>
    </div>`,
    ()=>saveWidget(),'');
  el('drawerSave').textContent='Add Widget';
}
function saveWidget(){
  if(insightWidgets.length>=MAX_WIDGETS){notice('ERR',`The dashboard is limited to ${MAX_WIDGETS} widgets — remove one first.`);return}
  const w={id:uid('W'),title:v('wTitle').trim(),source:v('wSource'),kind:v('wKind'),field:v('wField'),filter:null};
  const fieldKinds=['sum','avg','bar','pie','donut'];
  if(fieldKinds.includes(w.kind)&&!w.field){notice('ERR','Pick a field for this widget'+(['sum','avg'].includes(w.kind)?' — add a Number field in Data Tools if the list is empty.':'.'));return}
  if(!fieldKinds.includes(w.kind))w.field='';
  const ff=v('wfField');
  if(ff){
    const fv=v('wfValue');
    if(!String(fv).trim()){notice('ERR','The filter needs a value — or set the filter field back to “no filter”.');return}
    w.filter={field:ff,operator:v('wfOp')||'equals',value:fv};
  }
  if(!w.title)w.title=['bar','pie','donut'].includes(w.kind)?`${{roles:'Roles',people:'People',candidates:'Slate rows'}[w.source]} by ${w.field}`
    :w.kind==='sum'?`Total ${w.field}`:w.kind==='avg'?`Average ${w.field}`
    :w.kind==='percent'?`% of ${{roles:'roles',people:'people',candidates:'slate rows'}[w.source]}`
    :`${{roles:'Roles',people:'People',candidates:'Slate rows'}[w.source]} count`;
  pushUndo('Add dashboard widget');
  insightWidgets.push(w);
  log('Widget Added',w.title);
  notice('OK',`Widget added: ${w.title}`);
  activeTab='INSIGHTS';
  closeDrawer();render();
}
function removeWidget(id){
  const w=insightWidgets.find(x=>x.id===id);
  if(!w)return;
  pushUndo('Remove dashboard widget');
  insightWidgets=insightWidgets.filter(x=>x.id!==id);
  log('Widget Removed',w.title);
  render();
}

  dtAddField:()=>{
    const name=v('dtFieldName').trim().replace(/["\r\n]/g,'');
    const type=v('dtFieldType'),on=v('dtFieldOn');
    if(!name){notice('ERR','Give the field a name first.');return}
    if(CSV_HEADERS.includes(name)||BUILTIN_TYPABLE.includes(name)){notice('ERR',`"${name}" is a built-in field — set its type in the Built-in table at the bottom.`);return}
    if(fieldTypes[name]){notice('ERR',`"${name}" already exists — its type is in the table below.`);return}
    const a=allowedTypesFor(name);
    if((type==='number'&&!a.number)||(type==='boolean'&&!a.boolean)){notice('ERR',`"${name}" can’t be ${type} — existing values don’t fit. Fix the data first.`);return}
    pushUndo('Add field');
    fieldTypes[name]={type,on};
    log('Field Added',`${name} (${type}, applies to ${on})`);
    notice('OK',`Field "${name}" added as ${type==='boolean'?'True / False':type}.`);
    openDataTools();
  },
  convertXlsx:()=>pickConvertXlsx(),
  convertCsv:()=>pickConvertCsv(),
  addWidget:()=>openWidgetDrawer(),
  removeWidget:d=>removeWidget(d.widgetId),
});

<script>
'use strict';
/* =====================================================================
   Snapshot & boot — this block MUST stay last. It captures the page's
   own source (before anything renders) so Share / Export can hand out a
   working copy of the program, then boots the app.
   ===================================================================== */
const _bootTheme=document.documentElement.getAttribute('data-theme');
document.documentElement.removeAttribute('data-theme');
const SOURCE_SNAPSHOT='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
if(_bootTheme)document.documentElement.setAttribute('data-theme',_bootTheme);
function buildProgramCopy(locks){
  // the marker is assembled in pieces so this block never contains the
  // literal being replaced — only the real declaration in block 1 matches
  const decl='const PROGRAM_'+'LOCKS=';
  const mark=' /*PROGRAM_'+'LOCKS*/';
  const needle=decl+'{};'+mark;
  if(!SOURCE_SNAPSHOT.includes(needle))return null;
  return SOURCE_SNAPSHOT.replace(needle,decl+JSON.stringify(locks||{})+';'+mark);
}
if(locked('tools'))document.querySelectorAll('[data-action="dataTools"],[data-action="importSheets"],[data-action="downloadSheetTemplates"]').forEach(x=>x.style.display='none');
