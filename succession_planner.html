function saveRule(oldId=''){
  const type=v('ruleType');
  const r={id:v('ruleId').trim()||uid('RULE'),name:v('ruleName'),type,scope:'Candidate',field:'',operator:'',value:'',personId:v('rulePerson'),targetRoleId:v('ruleTarget'),altPersonId:'',severity:v('ruleSeverity')||'Block',message:v('ruleMsg'),enabled:v('ruleEnabled')==='true'};
  if(r.id!==oldId&&rules.some(x=>x.id===r.id)){notice('ERR',`Rule ID "${r.id}" already exists.`);return}
  const missing=[];
  if(!r.name)r.name=type==='FIELD_RULE'?'Candidate Field Rule':type==='BLOCK'?'Person Movement Block Rule':'Auto Backfill Rule';
  if(!r.message)r.message=`${r.name} triggered.`;
  if(type==='BLOCK'){
    r.severity='Block';
    r.operator=v('ruleBlockOperator')||'cannot move to target role';
    if(!r.personId)missing.push('Person');
    if(r.operator==='cannot move to target role'&&!r.targetRoleId)missing.push('Target Role');
    if(r.operator==='cannot change role')r.targetRoleId='';
  }
  if(type==='FIELD_RULE'){
    const conds=[...document.querySelectorAll('#conditionRows .condition-row')].map(row=>({field:row.querySelector('.condField')?.value||'',operator:row.querySelector('.condOperator')?.value||'',value:getConditionValues(row)})).filter(c=>c.field&&c.operator&&c.value);
    if(!conds.length)missing.push('At least one condition with a value');
    r.field=conds[0]?.field||'';r.operator=conds[0]?.operator||'';r.value=JSON.stringify(conds);
    r.personId='';r.targetRoleId='';
  }
  if(type==='AUTO_BACKFILL'){
    const autoType=v('autoTypeSelect');
    const autoTypes=autoType&&autoType!=='Custom'?[autoType]:[];
    const customMappings=[...document.querySelectorAll('#customMapRows .custom-map-row')].map(row=>({roleId:row.querySelector('.customRole')?.value||'',personId:row.querySelector('.customPerson')?.value||''})).filter(m=>m.roleId&&m.personId);
    if(!autoType)missing.push('Candidate type');
    if(autoType==='Custom'&&!customMappings.length)missing.push('At least one custom mapping row');
    r.value=JSON.stringify({mode:autoType==='Custom'?'custom':'type',autoTypes,customMappings});
    r.field='candidateType';r.operator='in list';r.personId='';r.targetRoleId='';
  }
  if(missing.length){notice('ERR','Missing required fields: '+missing.join(', '));return}
  pushUndo(oldId?'Update rule':'Add rule');
  const ix=rules.findIndex(x=>x.id===oldId||x.id===r.id);
  if(ix>=0)rules[ix]=r;else rules.push(r);
  log('Rule Saved',`${r.name} saved`);
  notice('OK',`Rule saved: ${r.name}`);
  activeTab='RULES';closeDrawer();render();
}
function deleteRule(id){
  if(!confirm('Delete this rule?'))return;
  pushUndo('Delete rule');
  const name=rules.find(r=>r.id===id)?.name||id;
  rules=rules.filter(r=>r.id!==id);
  log('Rule Deleted',name);
  notice('OK',`Rule deleted: ${name}`);
  closeDrawer();render();
}
function toggleRule(id,on){
  const r=rules.find(x=>x.id===id);if(!r)return;
  pushUndo(on?'Enable rule':'Disable rule');
  r.enabled=!!on;
  log(on?'Rule Enabled':'Rule Disabled',r.name||r.id);
  render();
}

/* ---------- manage tabs drawer ---------- */
function tabRowHtml(b={id:'',name:''}){return `<div class="tab-row"><div><label>Board ID</label><input class="bId" value="${attr(b.id||uid('BOARD'))}"></div><div><label>Board Name</label><input class="bName" value="${attr(b.name||'New Tab')}"></div><button class="btn btn-danger btn-sm" type="button" data-action="removeParent" data-target=".tab-row" style="align-self:end">Remove</button></div>`}
function addBoardRow(){el('boardRows').insertAdjacentHTML('beforeend',tabRowHtml({id:uid('BOARD'),name:'New Tab'}))}
function openBoardDrawer(){
  const rows=boards.filter(b=>!SYSTEM_BOARDS.includes(b.id)).map(b=>tabRowHtml(b)).join('');
  openDrawer('Manage Tabs','Board tabs group roles. A role joins a board via its Board/Tab field (or when the board name matches its department). Changes apply on Save.',
    `<div id="boardRows">${rows||''}</div><button class="btn btn-green btn-sm" type="button" data-action="addBoardRow">+ Add Tab</button>`,
    ()=>{
      pushUndo('Update tabs');
      const ids=[...document.querySelectorAll('#boardRows .bId')],names=[...document.querySelectorAll('#boardRows .bName')];
      boards=systemBoards();
      ids.forEach((x,i)=>{const bid=x.value.trim(),bnm=names[i].value.trim();if(bid&&bnm&&!boards.some(b=>b.id===bid))boards.push({id:bid,name:bnm})});
      if(!boards.some(b=>b.id===activeTab))activeTab='MASTER';
      log('Tabs Saved',`${boards.length-SYSTEM_TABS.length} custom tabs saved`);
      notice('OK','Tabs updated.');
      closeDrawer();render();
    });
}

/* =====================================================================
   Event delegation, keyboard, boot
   ===================================================================== */
const ACTIONS={
  tab:d=>{activeTab=d.tabId;render()},
  openCSV:()=>openCSV(),
  saveCSV:()=>saveCSV(),
  exportCSV:()=>exportCSV(),
  addChooser:()=>openAddChooser(),
  undo:()=>undoLastAction(),
  toggleMenu:()=>el('moreMenu').classList.toggle('open'),
  manageTabs:()=>{el('moreMenu').classList.remove('open');openBoardDrawer()},
  resetOrg:()=>{el('moreMenu').classList.remove('open');resetOrgChanges()},
  clearAll:()=>{el('moreMenu').classList.remove('open');clearAll()},
  restoreBackup:()=>restoreBackup(),
  dismissBanner:()=>{el('banner').innerHTML=''},
  openRole:d=>openRoleDrawer(d.roleId),
  openRoleDrawerNew:()=>openRoleDrawer(),
  openPerson:d=>openPersonDrawer(d.personId),
  openPersonDrawerNew:()=>openPersonDrawer('','','Successor'),
  openPersonFromSlate:d=>{const s=successors.find(x=>x.id===d.succId);openPersonDrawer(d.personId,s?s.roleId:'')},
  openRule:d=>openRuleDrawer(d.ruleId),
  openRuleDrawerNew:()=>openRuleDrawer(),
  selectPiece:d=>{selectedPersonId=d.personId;setStatus(personName(d.personId)+' selected — use “+” on a role card');render()},
  clearSelection:()=>{selectedPersonId='';render()},
  assignSelected:d=>{if(selectedPersonId)addSuccessor(selectedPersonId,d.roleId)},
  approveTop:d=>approveTop(d.roleId),
  approveSucc:d=>approveSuccessor(d.succId),
  autoMove:d=>autoMove(d.succId),
  rank:d=>moveRank(d.succId,+d.delta),
  removeSucc:d=>removeSuccessor(d.succId),
  closeDrawer:()=>closeDrawer(),
  goBack:()=>goBack(),
  deletePerson:d=>deletePerson(d.personId),
  deleteRole:d=>deleteRole(d.roleId),
  deleteRule:d=>deleteRule(d.ruleId),
  addCandidateFromRole:d=>openPersonDrawer('',d.roleId||'','Successor'),
  drawerRank:d=>{moveRank(d.succId,+d.delta);if(role(d.roleId))openRoleDrawer(d.roleId)},
  drawerAuto:d=>{autoMove(d.succId);if(role(d.roleId))openRoleDrawer(d.roleId)},
  drawerApprove:d=>{approveSuccessor(d.succId);if(role(d.roleId))openRoleDrawer(d.roleId)},
  drawerRemoveSucc:d=>{removeSuccessor(d.succId);if(role(d.roleId))openRoleDrawer(d.roleId)},
  personSlateRemove:d=>{removeSuccessor(d.succId);if(person(d.personId))openPersonDrawer(d.personId)},
  addConditionRow:()=>addConditionRow(),
  addCheckboxValue:(d,elm)=>addRuleCheckboxValue(elm),
  addCustomMapRow:()=>addCustomMapRow(),
  addBoardRow:()=>addBoardRow(),
  removeParent:(d,elm)=>elm.closest(d.target)?.remove(),
};
document.addEventListener('click',e=>{
  const elm=e.target.closest('[data-action]');
  const menu=el('moreMenu');
  if(menu.classList.contains('open')&&!e.target.closest('.menu-wrap'))menu.classList.remove('open');
  if(!elm)return;
  const fn=ACTIONS[elm.dataset.action];
  if(fn){e.preventDefault();fn(elm.dataset,elm,e)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.change==='filter')return render();
  if(t.dataset.change==='pieceFilter')return renderPieceBox();
  if(t.dataset.change==='customSelect')return handleCustomSelect(t);
  if(t.dataset.change==='ruleToggle')return toggleRule(t.dataset.ruleId,t.checked);
  if(t.classList.contains('condField')||t.classList.contains('condOperator'))return updateConditionValue(t);
  if(t.classList.contains('condValueSelect'))return handleRuleValueSelect(t);
  if(t.classList.contains('selAll'))return toggleAllCondValues(t);
  if(t.id==='ruleType')return updateRuleTypeUI();
  if(t.id==='ruleBlockOperator')return updateBlockTargetUI();
  if(t.id==='autoTypeSelect')return updateAutoCustomUI();
});
let searchTimer=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.input==='render'){clearTimeout(searchTimer);searchTimer=setTimeout(render,140)}
  if(t.dataset.input==='pieceBox'){clearTimeout(searchTimer);searchTimer=setTimeout(renderPieceBox,140)}
});

/* ---------- drag & drop ---------- */
document.addEventListener('dragstart',e=>{
  const elm=e.target.closest('[data-drag]');
  if(!elm)return;
  e.dataTransfer.effectAllowed='move';
  if(elm.dataset.drag==='succ'){e.dataTransfer.setData('succId',elm.dataset.succId);e.dataTransfer.setData('personId',elm.dataset.personId)}
  else if(elm.dataset.drag==='person')e.dataTransfer.setData('personId',elm.dataset.personId);
});
document.addEventListener('dragover',e=>{
  if([...e.dataTransfer.types].includes('Files')){e.preventDefault();return}
  const t=e.target.closest('[data-drop]');
  if(t){e.preventDefault();t.classList.add('dragover')}
});
document.addEventListener('dragleave',e=>{
  const t=e.target.closest('[data-drop]');
  if(t)t.classList.remove('dragover');
});
document.addEventListener('drop',async e=>{
  e.preventDefault();
  document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));
  if(e.dataTransfer.files&&e.dataTransfer.files.length){
    const f=e.dataTransfer.files[0];
    if(/\.csv$/i.test(f.name)){if(loadCSV(await f.text())){fileHandle=null;el('dbStatus').textContent=f.name+' (dropped — use Export to save changes)'}}
    else notice('WARN','Only .csv files can be dropped here.');
    return;
  }
  const t=e.target.closest('[data-drop]');
  if(!t)return;
  const succId=e.dataTransfer.getData('succId'),personId=e.dataTransfer.getData('personId');
  if(t.dataset.drop==='succ'){
    const target=successors.find(x=>x.id===t.dataset.succId);
    if(!target)return;
    if(succId)return reorderSuccessorBefore(succId,target.id);
    if(personId)return addSuccessorBefore(personId,target.roleId,target.id);
  }else if(t.dataset.drop==='role'){
    if(succId)return moveSuccessorToRole(succId,t.dataset.roleId);
    if(personId)return addSuccessor(personId,t.dataset.roleId);
  }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const modal=el('smallValueModal');
    if(modal){modal.remove();return}
    if(el('moreMenu').classList.contains('open')){el('moreMenu').classList.remove('open');return}
    if(drawerIsOpen())closeDrawer();
    return;
  }
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&(e.key==='s'||e.key==='S')){e.preventDefault();saveCSV();return}
  if(mod&&(e.key==='z'||e.key==='Z')){
    const tag=(document.activeElement?.tagName||'').toLowerCase();
    if(!['input','textarea','select'].includes(tag)&&!drawerIsOpen()){e.preventDefault();undoLastAction()}
  }
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
el('drawer').addEventListener('mousedown',e=>{if(e.target.id==='drawer')closeDrawer()});

/* ---------- test / automation hooks ---------- */
window.__APP__={
  get roles(){return roles},get people(){return people},get successors(){return successors},
  get rules(){return rules},get history(){return history},get boards(){return boards},
  get customFieldValues(){return customFieldValues},get activeTab(){return activeTab},set activeTab(x){activeTab=x},
  get dirty(){return dirty},get undoDepth(){return undoStack.length},get messages(){return messages},
  get selectedPersonId(){return selectedPersonId},set selectedPersonId(x){selectedPersonId=x},
  loadCSV,toCSV,render,parseCSV,csvEsc,addSuccessor,addSuccessorBefore,reorderSuccessorBefore,moveSuccessorToRole,moveRank,removeSuccessor,
  approveSuccessor,approveTop,autoMove,evaluateRules,undoLastAction,resetOrgChanges,clearAll,consolidateDuplicateData,validateDataLinks,
  openPersonDrawer,savePerson,deletePerson,openRoleDrawer,saveRole,deleteRole,openRuleDrawer,saveRule,deleteRule,toggleRule,openBoardDrawer,
  openAddChooser,closeDrawer,addCustomValue,valuesForField,handleCustomSelect,isRoleVacant,slateFor,normalizeRanks,runVacancyAutomation,
};

/* ---------- boot ---------- */
render();
checkBackup();
setStatus('Ready — open your CSV database or add records.');
</script>
